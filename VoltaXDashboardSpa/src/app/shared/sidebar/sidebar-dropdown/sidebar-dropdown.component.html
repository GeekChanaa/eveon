<div class="sidebar__item sidebar__item_dropdown" [class.active]="expanded">
  <div class="sidebar__top" [class.active]="active">
    <button type="button" class="sidebar__head" (click)="toggle($event)"
      [attr.aria-expanded]="expanded" [attr.title]="title | titlecase">
      <svg class="icon {{iconID}}">
        <use [attr.href]="'#' + iconID"></use>
      </svg>
      {{ title | titlecase }}
      <svg class="icon icon-arrow-down">
        <use xlink:href="#icon-arrow-down"></use>
      </svg>
    </button>
  </div>
  <div class="sidebar__body">
    <ng-content></ng-content>
  </div>
</div>
