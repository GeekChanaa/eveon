<div #sidebar class="sidebar">
  <button #close class="sidebar__close">
    <svg class="icon icon-close">
      <use xlink:href="#icon-close"></use>
    </svg>
  </button><a class="sidebar__logo" routerLink="/dashboard">
      <img src="/assets/images/logos/logo.svg" alt="Core">
    </a>
  
    <div class="sidebar__menu">
      <!-- Customer menu -->
      <app-sidebar-item *ngIf="role == 1" [title]="'home'" [link]="'/my-dashboard'" [active]="isActive('/my-dashboard')"></app-sidebar-item>
      <app-sidebar-item *ngIf="role == 1" [title]="'my cards'" [link]="'/my-dashboard/my-cards'" [active]="isActive('/my-dashboard/my-cards')"></app-sidebar-item>
      <app-sidebar-item *ngIf="role == 1" [title]="'my profile'" [link]="'/my-dashboard/profile'" [active]="isActive('/my-dashboard/profile')"></app-sidebar-item>
  
      <!-- Admin/Operator menu -->
      <app-sidebar-item *ngIf="role == 0" [title]="'home'" [link]="'/dashboard'" [active]="isActive('/dashboard')"></app-sidebar-item>
  
      <app-sidebar-dropdown *ngIf="role == 0" [title]="'Operation Monitoring'" 
        [active]="isDropdownActive('/dashboard/connector-realtime') || isDropdownActive('/dashboard/statistics')">
        <app-sidebar-link [title]="'Connector real-time'" [link]="'/dashboard/connector-realtime'" [active]="isActive('/dashboard/connector-realtime')"></app-sidebar-link>
        <app-sidebar-link [title]="'statistics'" [link]="'/dashboard/statistics'" [active]="isActive('/dashboard/statistics')"></app-sidebar-link>
      </app-sidebar-dropdown>
  
      <app-sidebar-dropdown *ngIf="role == 0" [title]="'Station Management'" 
        [active]="isDropdownActive('/dashboard/charging-stations') || isDropdownActive('/dashboard/charging-points')">
        <app-sidebar-link [title]="'charging station'" [link]="'/dashboard/charging-stations'" [active]="isActive('/dashboard/charging-stations')"></app-sidebar-link>
        <app-sidebar-link [title]="'charge point'" [link]="'/dashboard/charging-points'" [active]="isActive('/dashboard/charging-points')"></app-sidebar-link>
      </app-sidebar-dropdown>
  
      <app-sidebar-dropdown *ngIf="role == 0" [title]="'business management'" 
        [active]="isDropdownActive('/dashboard/charging-cards')">
        <app-sidebar-link [title]="'charging cards'" [link]="'/dashboard/charging-cards'" [active]="isActive('/dashboard/charging-cards')"></app-sidebar-link>
      </app-sidebar-dropdown>
  
      <app-sidebar-dropdown *ngIf="role == 0" [title]="'app management'" 
        [active]="isDropdownActive('/dashboard/comments') || isDropdownActive('/dashboard/reports')">
        <app-sidebar-link [title]="'comments management'" [link]="'/dashboard/comments'" [active]="isActive('/dashboard/comments')"></app-sidebar-link>
        <app-sidebar-link [title]="'reports management'" [link]="'/dashboard/reports'" [active]="isActive('/dashboard/reports')"></app-sidebar-link>
      </app-sidebar-dropdown>
  
      <app-sidebar-dropdown *ngIf="role == 0" [title]="'order management'" 
        [active]="isDropdownActive('/dashboard/transactions') || isDropdownActive('/dashboard/recharge-orders')">
        <app-sidebar-link [title]="'transactions'" [link]="'/dashboard/transactions'" [active]="isActive('/dashboard/transactions')"></app-sidebar-link>
        <app-sidebar-link [title]="'recharge orders'" [link]="'/dashboard/recharge-orders'" [active]="isActive('/dashboard/recharge-orders')"></app-sidebar-link>
      </app-sidebar-dropdown>
  
      <app-sidebar-dropdown *ngIf="role == 0" [title]="'maintenance management'" 
        [active]="isDropdownActive('/dashboard/alarm-management')">
        <app-sidebar-link [title]="'alarm management'" [link]="'/dashboard/alarm-management'" [active]="isActive('/dashboard/alarm-management')"></app-sidebar-link>
      </app-sidebar-dropdown>
  
      <app-sidebar-dropdown *ngIf="role == 0" [title]="'ocpp operation'" 
        [active]="isDropdownActive('/dashboard/ocpp-local-list') || isDropdownActive('/dashboard/charging-profile') || isDropdownActive('/dashboard/ocpp-configuration')">
        <app-sidebar-link [title]="'local list'" [link]="'/dashboard/ocpp-local-list'" [active]="isActive('/dashboard/ocpp-local-list')"></app-sidebar-link>
        <app-sidebar-link [title]="'charging profile'" [link]="'/dashboard/charging-profile'" [active]="isActive('/dashboard/charging-profile')"></app-sidebar-link>
        <app-sidebar-link [title]="'configuration'" [link]="'/dashboard/ocpp-configuration'" [active]="isActive('/dashboard/ocpp-configuration')"></app-sidebar-link>
      </app-sidebar-dropdown>
  
      <app-sidebar-dropdown *ngIf="role == 0" [title]="'Account'" 
        [active]="isDropdownActive('/dashboard/users')">
        <app-sidebar-link [title]="'users'" [link]="'/dashboard/users'" [active]="isActive('/dashboard/users')"></app-sidebar-link>
        <app-sidebar-link [title]="'partners'" [link]="'/dashboard/partners'" [active]="isActive('/dashboard/partners')"></app-sidebar-link>
      </app-sidebar-dropdown>
  
      <!-- Partner menu -->
      <ng-container *ngIf="role == 4">
        <app-sidebar-dropdown [title]="'Station Management'" 
          [active]="isDropdownActive('/partner-dashboard/charging-stations') || isDropdownActive('/partner-dashboard/charging-points') || isDropdownActive('/partner-dashboard/connectors')">
          <app-sidebar-link [title]="'charging station'" [link]="'/partner-dashboard/charging-stations'" [active]="isActive('/partner-dashboard/charging-stations')"></app-sidebar-link>
          <app-sidebar-link [title]="'charge point'" [link]="'/partner-dashboard/charging-points'" [active]="isActive('/partner-dashboard/charging-points')"></app-sidebar-link>
          <app-sidebar-link [title]="'connector'" [link]="'/partner-dashboard/connectors'" [active]="isActive('/partner-dashboard/connectors')"></app-sidebar-link>
        </app-sidebar-dropdown>
  
        <app-sidebar-dropdown [title]="'Operation Monitoring'" 
          [active]="isDropdownActive('/partner-dashboard/statistics') || isDropdownActive('/dashboard/connector-realtime')">
          <app-sidebar-link [title]="'Connector real-time'" [link]="'/dashboard/connector-realtime'" [active]="isActive('/dashboard/connector-realtime')"></app-sidebar-link>
          <app-sidebar-link [title]="'statistics'" [link]="'/partner-dashboard/statistics'" [active]="isActive('/partner-dashboard/statistics')"></app-sidebar-link>
        </app-sidebar-dropdown>
  
        <app-sidebar-dropdown [title]="'order management'" 
          [active]="isDropdownActive('/partner-dashboard/transactions')">
          <app-sidebar-link [title]="'transactions'" [link]="'/partner-dashboard/transactions'" [active]="isActive('/partner-dashboard/transactions')"></app-sidebar-link>
        </app-sidebar-dropdown>
      </ng-container>
  </div>
  
  <div class="sidebar__foot">
    <button class="sidebar__help">
      <svg class="icon icon-help">
        <use xlink:href="#icon-help"></use>
      </svg>Help & getting started
      <div class="sidebar__counter">8</div>
    </button>
    <label class="theme js-theme">
      <input [(ngModel)]="checked" class="theme__input" type="checkbox"/>
      <span class="theme__inner">
        <span class="theme__box">
          <svg class="icon icon-sun">
            <use xlink:href="#icon-sun"></use>
          </svg>Light
        </span>

        <span class="theme__box">
          <svg class="icon icon-moon">
            <use xlink:href="#icon-moon"></use>
          </svg>Dark</span>
        </span>
      </label>
  </div>
