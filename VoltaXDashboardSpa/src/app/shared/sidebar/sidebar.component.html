<div #sidebar class="sidebar" [class.active]="opened">
  <button #close class="sidebar__close">
    <svg class="icon icon-close">
      <use xlink:href="#icon-close"></use>
    </svg>
  </button>

  <div class="sidebar__brand">
    <a class="sidebar__logo" *ngIf="partnerID == 0" [routerLink]="customerShell ? '/my-dashboard' : '/dashboard'">
      <ng-container>
        <img class="sidebar__logo-full some-icon" src="/assets/images/logos/logo.svg" alt="eveon">
        <img class="sidebar__logo-full some-icon-dark" src="/assets/images/logos/logo-white.svg" alt="eveon">
        <img class="sidebar__logo-mark some-icon" src="/assets/images/logos/logo-mark.svg" alt="eveon">
        <img class="sidebar__logo-mark some-icon-dark" src="/assets/images/logos/logo-mark-white.svg" alt="eveon">
      </ng-container>
    </a>

    <a class="sidebar__logo" *ngIf="partnerID != 0" routerLink="/partner-dashboard">
      <ng-container *ngIf="partnerImageUrl">
        <img class="sidebar__partner-logo" [src]="partnerImageUrl" [alt]="partnerName">
      </ng-container>
      <ng-container *ngIf="!partnerImageUrl">
        <img class="sidebar__logo-full some-icon" src="/assets/images/logos/logo.svg" alt="eveon">
        <img class="sidebar__logo-full some-icon-dark" src="/assets/images/logos/logo-white.svg" alt="eveon">
        <img class="sidebar__logo-mark some-icon" src="/assets/images/logos/logo-mark.svg" alt="eveon">
        <img class="sidebar__logo-mark some-icon-dark" src="/assets/images/logos/logo-mark-white.svg" alt="eveon">
      </ng-container>
    </a>

    <button
      type="button"
      class="sidebar__toggle-btn"
      (click)="toggleCollapsed()"
      [attr.aria-expanded]="!collapsed"
      [attr.aria-label]="(collapsed ? 'nav.expand' : 'nav.collapse') | translate"
      [title]="(collapsed ? 'nav.expand' : 'nav.collapse') | translate">
      <svg class="icon icon-list">
        <use xlink:href="#icon-list"></use>
      </svg>
    </button>
  </div>

  <div class="sidebar__menu">
    <!-- Customer portal menu -->
    <ng-container *ngIf="customerShell">
      <app-sidebar-item [title]="'nav.home'" [link]="'/my-dashboard'" [active]="isExactActive('/my-dashboard')"></app-sidebar-item>
      <app-sidebar-dropdown iconID="icon-type2-charger" [title]="'nav.myCharging'"
        [active]="isDropdownActive('/my-dashboard/sessions', '/my-dashboard/cards')">
        <app-sidebar-link [title]="'nav.chargingSessions'" [link]="'/my-dashboard/sessions'" [active]="isActive('/my-dashboard/sessions')"></app-sidebar-link>
        <app-sidebar-link [title]="'nav.myCards'" [link]="'/my-dashboard/cards'" [active]="isActive('/my-dashboard/cards')"></app-sidebar-link>
      </app-sidebar-dropdown>
      <app-sidebar-dropdown iconID="icon-money-bill" [title]="'nav.payments'"
        [active]="isDropdownActive('/my-dashboard/wallet', '/my-dashboard/payment-methods')">
        <app-sidebar-link [title]="'nav.wallet'" [link]="'/my-dashboard/wallet'" [active]="isActive('/my-dashboard/wallet')"></app-sidebar-link>
        <app-sidebar-link [title]="'nav.paymentMethods'" [link]="'/my-dashboard/payment-methods'" [active]="isActive('/my-dashboard/payment-methods')"></app-sidebar-link>
      </app-sidebar-dropdown>
      <app-sidebar-item [title]="'header.myProfile'" [link]="'/my-dashboard/profile'" [active]="isExactActive('/my-dashboard/profile')"></app-sidebar-item>
    </ng-container>

    <ng-container *ngIf="partnerID == 0 && !customerShell">
      <!-- Admin/Operator menu -->
      <app-sidebar-item *ngIf="access.canUrl('/dashboard')" [title]="'nav.home'" [link]="'/dashboard'" [active]="isExactActive('/dashboard')"></app-sidebar-item>

      <app-sidebar-dropdown *ngIf="access.canUrl('/dashboard/connector-realtime') || access.canUrl('/dashboard/statistics')" iconID="icon-type2-charger" [title]="'nav.operationMonitoring'"
        [active]="isDropdownActive('/dashboard/connector-realtime', '/dashboard/statistics')">
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/connector-realtime')" [title]="'nav.connectorRealtime'" [link]="'/dashboard/connector-realtime'"
          [active]="isActive('/dashboard/connector-realtime')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/statistics')" [title]="'nav.statistics'" [link]="'/dashboard/statistics'"
          [active]="isActive('/dashboard/statistics')"></app-sidebar-link>
      </app-sidebar-dropdown>

      <app-sidebar-dropdown *ngIf="access.canUrl('/dashboard/charging-stations') || access.canUrl('/dashboard/charging-points')" iconID="icon-charging-station" [title]="'nav.stationManagement'"
        [active]="isDropdownActive('/dashboard/charging-stations', '/dashboard/charging-points')">
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/charging-stations')" [title]="'nav.chargingStations'" [link]="'/dashboard/charging-stations'"
          [active]="isActive('/dashboard/charging-stations')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/charging-points')" [title]="'nav.chargePoints'" [link]="'/dashboard/charging-points'"
          [active]="isActive('/dashboard/charging-points')"></app-sidebar-link>
      </app-sidebar-dropdown>

      <app-sidebar-dropdown *ngIf="access.canUrl('/dashboard/charging-cards')" iconID="icon-money-bill" [title]="'nav.businessManagement'"
        [active]="isDropdownActive('/dashboard/charging-cards')">
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/charging-cards')" [title]="'nav.chargingCards'" [link]="'/dashboard/charging-cards'"
          [active]="isActive('/dashboard/charging-cards')"></app-sidebar-link>
      </app-sidebar-dropdown>

      <app-sidebar-dropdown *ngIf="access.canUrl('/dashboard/notices') || access.canUrl('/dashboard/reports') || access.canUrl('/dashboard/user-info-download-requests')" iconID="icon-comment" [title]="'nav.appManagement'"
        [active]="isDropdownActive('/dashboard/reports', '/dashboard/notices', '/dashboard/user-info-download-requests')">
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/notices')" [title]="'nav.notices'" [link]="'/dashboard/notices'"
          [active]="isActive('/dashboard/notices')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/reports')" [title]="'nav.reports'" [link]="'/dashboard/reports'"
          [active]="isActive('/dashboard/reports')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/user-info-download-requests')" [title]="'nav.dataRequests'" [link]="'/dashboard/user-info-download-requests'"
          [active]="isActive('/dashboard/user-info-download-requests')"></app-sidebar-link>
      </app-sidebar-dropdown>

      <app-sidebar-dropdown *ngIf="access.canUrl('/dashboard/charging-sessions') || access.canUrl('/dashboard/transactions') || access.canUrl('/dashboard/recharge-orders') || access.canUrl('/dashboard/settlements')" iconID="icon-invoice" [title]="'nav.orderManagement'"
        [active]="isDropdownActive('/dashboard/transactions', '/dashboard/recharge-orders', '/dashboard/charging-sessions', '/dashboard/invoices', '/dashboard/settlements')">
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/charging-sessions')" [title]="'nav.chargingSessions'" [link]="'/dashboard/charging-sessions'"
          [active]="isActive('/dashboard/charging-sessions')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/transactions')" [title]="'nav.transactions'" [link]="'/dashboard/transactions'"
          [active]="isActive('/dashboard/transactions')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/recharge-orders')" [title]="'nav.rechargeOrders'" [link]="'/dashboard/recharge-orders'"
          [active]="isActive('/dashboard/recharge-orders')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/invoices')" [title]="'billing.nav.invoices'" [link]="'/dashboard/invoices'"
          [active]="isActive('/dashboard/invoices')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/settlements')" [title]="'billing.nav.settlements'" [link]="'/dashboard/settlements'"
          [active]="isActive('/dashboard/settlements')"></app-sidebar-link>
      </app-sidebar-dropdown>

      <app-sidebar-dropdown *ngIf="access.canUrl('/dashboard/global-configurations') || access.canUrl('/dashboard/system-reports')" iconID="icon-setting" [title]="'nav.maintenance'"
        [active]="isDropdownActive('/dashboard/global-configurations', '/dashboard/system-reports')">
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/global-configurations')" [title]="'nav.globalConfigurations'" [link]="'/dashboard/global-configurations'"
          [active]="isActive('/dashboard/global-configurations')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/system-reports')" [title]="'nav.systemReports'" [link]="'/dashboard/system-reports'"
          [active]="isActive('/dashboard/system-reports')"></app-sidebar-link>
      </app-sidebar-dropdown>

      <app-sidebar-dropdown *ngIf="access.canUrl('/dashboard/ocpp-local-list') || access.canUrl('/dashboard/ocpp-configuration') || access.canUrl('/dashboard/charge-point-configurations') || access.canUrl('/dashboard/charger-events')" iconID="icon-maintenance" [title]="'nav.ocppOperation'"
        [icon]="'/assets/images/icons/updated/bolt.svg'" [active]="isDropdownActive('/dashboard/ocpp-local-list', '/dashboard/ocpp-configuration', '/dashboard/charge-point-configurations', '/dashboard/charger-events')">
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/charger-events')" [title]="'nav.chargerEvents'" [link]="'/dashboard/charger-events'"
          [active]="isActive('/dashboard/charger-events')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/charge-point-configurations')" [title]="'nav.chargePointConfigurations'" [link]="'/dashboard/charge-point-configurations'"
          [active]="isActive('/dashboard/charge-point-configurations')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/ocpp-configuration')" [title]="'nav.defaultConfiguration'" [link]="'/dashboard/ocpp-configuration'"
          [active]="isActive('/dashboard/ocpp-configuration')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/ocpp-local-list')" [title]="'nav.localList'" [link]="'/dashboard/ocpp-local-list'"
          [active]="isActive('/dashboard/ocpp-local-list')"></app-sidebar-link>
      </app-sidebar-dropdown>

      <app-sidebar-dropdown *ngIf="access.canUrl('/dashboard/users') || access.canUrl('/dashboard/partners')" iconID="icon-account-setting" [title]="'nav.account'"
        [active]="isDropdownActive('/dashboard/users', '/dashboard/partners', '/dashboard/roles', '/dashboard/audit-logs', '/dashboard/ocpi', '/dashboard/pki')">
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/users')" [title]="'nav.users'" [link]="'/dashboard/users'"
          [active]="isActive('/dashboard/users')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.canUrl('/dashboard/partners')" [title]="'nav.partners'" [link]="'/dashboard/partners'"
          [active]="isActive('/dashboard/partners')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.isAdmin" [title]="'nav.roles'" [link]="'/dashboard/roles'"
          [active]="isActive('/dashboard/roles')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.isAdmin" [title]="'nav.auditLog'" [link]="'/dashboard/audit-logs'"
          [active]="isActive('/dashboard/audit-logs')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.isAdmin" [title]="'nav.roaming'" [link]="'/dashboard/ocpi'"
          [active]="isActive('/dashboard/ocpi')"></app-sidebar-link>
        <app-sidebar-link *ngIf="access.isAdmin" [title]="'nav.pki'" [link]="'/dashboard/pki'"
          [active]="isActive('/dashboard/pki')"></app-sidebar-link>
      </app-sidebar-dropdown>


    </ng-container>

    <!-- Partner portal menu -->
    <ng-container *ngIf="partnerID != 0">
      <app-sidebar-item [title]="'nav.home'" [link]="'/partner-dashboard'"
        [active]="isExactActive('/partner-dashboard')"></app-sidebar-item>
      <app-sidebar-dropdown iconID="icon-type2-charger" [title]="'nav.myNetwork'"
        [active]="isDropdownActive('/partner-dashboard/stations', '/partner-dashboard/charge-points')">
        <app-sidebar-link [title]="'nav.chargingStations'" [link]="'/partner-dashboard/stations'"
          [active]="isActive('/partner-dashboard/stations')"></app-sidebar-link>
        <app-sidebar-link [title]="'nav.chargePointsPrices'" [link]="'/partner-dashboard/charge-points'"
          [active]="isActive('/partner-dashboard/charge-points')"></app-sidebar-link>
      </app-sidebar-dropdown>
      <app-sidebar-dropdown iconID="icon-invoice" [title]="'nav.activity'"
        [active]="isDropdownActive('/partner-dashboard/sessions', '/partner-dashboard/statistics', '/partner-dashboard/statements')">
        <app-sidebar-link [title]="'nav.chargingSessions'" [link]="'/partner-dashboard/sessions'"
          [active]="isActive('/partner-dashboard/sessions')"></app-sidebar-link>
        <app-sidebar-link [title]="'nav.statistics'" [link]="'/partner-dashboard/statistics'"
          [active]="isActive('/partner-dashboard/statistics')"></app-sidebar-link>
        <app-sidebar-link [title]="'billing.nav.statements'" [link]="'/partner-dashboard/statements'"
          [active]="isActive('/partner-dashboard/statements')"></app-sidebar-link>
      </app-sidebar-dropdown>
      <app-sidebar-item [title]="'nav.partnerProfile'" [link]="'/partner-dashboard/profile'"
        [active]="isExactActive('/partner-dashboard/profile')"></app-sidebar-item>
      <app-sidebar-item [title]="'nav.security'" [link]="'/partner-dashboard/security'"
        [active]="isExactActive('/partner-dashboard/security')"></app-sidebar-item>
    </ng-container>
  </div>

  <div class="sidebar__foot">
  <button *ngIf="!customerShell && access.canUrl('/dashboard/documentation')" class="sidebar__help" routerLink="/dashboard/documentation">
    <svg class="icon icon-help">
      <use xlink:href="#icon-help"></use>
    </svg>
    {{ 'nav.help' | translate }}
  </button>

  <label class="theme js-theme">
    <input
      [(ngModel)]="checked"
      class="theme__input"
      type="checkbox"
      (change)="onThemeToggle()" />
    <span class="theme__inner">
      <span class="theme__box">
        <svg class="icon icon-sun">
          <use xlink:href="#icon-sun"></use>
        </svg>
        {{ 'theme.light' | translate }}
      </span>
      <span class="theme__box">
        <svg class="icon icon-moon">
          <use xlink:href="#icon-moon"></use>
        </svg>
        {{ 'theme.dark' | translate }}
      </span>
    </span>
  </label>
</div>


  <div #helpOverlay class="overlay"></div>
  <div #help class="help">
    <button #helpClose class="help__close" type="button"></button>
  </div>
</div>

<div class="sidebar__backdrop" [class.active]="opened" (click)="closeDrawer()"></div>
