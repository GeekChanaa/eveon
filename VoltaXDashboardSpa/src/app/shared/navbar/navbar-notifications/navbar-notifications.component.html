<div class="header__item header__item_notifications" (keydown.escape)="close(true)">
  <button #toggle type="button" class="header__head" [class.active]="state.unreadCount > 0" (click)="togglePanel()"
    aria-haspopup="true" [attr.aria-expanded]="open" aria-controls="notification-panel"
    [attr.aria-label]="state.unreadCount ? 'Notifications, ' + state.unreadCount + ' unread' : 'Notifications'">
    <svg class="icon icon-notification" aria-hidden="true">
      <use xlink:href="#icon-notification"></use>
    </svg>
  </button>

  <section id="notification-panel" class="notif-panel" *ngIf="open" aria-label="Notifications">
    <header class="notif-panel__head">
      <div>
        <h2>Notifications</h2>
        <p>{{ state.unreadCount ? state.unreadCount + ' unread' : 'You are all caught up' }}</p>
      </div>
      <div class="notif-panel__tools">
        <button type="button" class="notif-link" [disabled]="!state.unreadCount" (click)="markAllAsRead()">Mark all as read</button>
        <button type="button" class="notif-link notif-link--muted" [disabled]="!state.items.length" (click)="requestClearAll()">Clear all</button>
      </div>
    </header>

    <div class="notif-filter" role="group" aria-label="Filter notifications">
      <button type="button" [class.is-active]="filter === 'all'" [attr.aria-pressed]="filter === 'all'" (click)="filter = 'all'">All</button>
      <button type="button" [class.is-active]="filter === 'unread'" [attr.aria-pressed]="filter === 'unread'" (click)="filter = 'unread'">
        Unread <span *ngIf="state.unreadCount" class="notif-count">{{ badge }}</span>
      </button>
    </div>

    <div class="notif-list">
      <p class="notif-state" *ngIf="state.loading && !state.items.length" role="status">Loading notifications...</p>
      <div class="notif-state" *ngIf="state.error && !state.items.length" role="alert">
        <p>Could not load notifications.</p>
        <button type="button" class="notif-link" (click)="retry()">Retry</button>
      </div>
      <p class="notif-state" *ngIf="!state.loading && !state.error && !visibleItems.length">
        {{ filter === 'unread' ? 'No unread notifications.' : 'No notifications yet. Charger outages, reports and data requests will show up here.' }}
      </p>

      <article *ngFor="let item of visibleItems" class="notif-item" [class.is-unread]="!item.read" [attr.data-tone]="meta(item).tone">
        <button type="button" class="notif-item__main" (click)="openNotification(item)">
          <span class="notif-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path [attr.d]="meta(item).icon" /></svg>
          </span>
          <span class="notif-item__body">
            <span class="notif-item__line">
              <strong>{{ meta(item).label }}</strong>
              <span *ngIf="item.urgent" class="notif-urgent">Urgent</span>
              <time [attr.datetime]="item.createdAt" [title]="item.createdAt | date:'medium'">{{ timeAgo(item.createdAt) }}</time>
            </span>
            <span class="notif-item__text">{{ item.description }}</span>
          </span>
          <span *ngIf="!item.read" class="notif-dot"><span class="visually-hidden">Unread</span></span>
        </button>
        <button type="button" class="notif-remove" (click)="remove(item, $event)" aria-label="Remove notification">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </article>
    </div>
  </section>
</div>

<div class="notif-toasts" aria-live="polite">
  <div *ngFor="let toast of toasts" class="notif-toast" [attr.data-tone]="meta(toast.notification).tone">
    <button type="button" class="notif-toast__main" (click)="openNotification(toast.notification)">
      <span class="notif-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path [attr.d]="meta(toast.notification).icon" /></svg>
      </span>
      <span class="notif-item__body">
        <strong>{{ meta(toast.notification).label }}</strong>
        <span class="notif-item__text">{{ toast.notification.description }}</span>
      </span>
    </button>
    <button type="button" class="notif-remove" (click)="dismissToast(toast.notification.id)" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
    </button>
  </div>
</div>
