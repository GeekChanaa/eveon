<header class="header" data-id="#header">
  <button type="button" class="header__burger" [attr.aria-label]="'header.openMenu' | translate" (click)="toggleSidebar()"></button>
  <app-navbar-search></app-navbar-search>
  <button class="header__search">
    <svg class="icon icon-search">
      <use xlink:href="#icon-search"></use>
    </svg>
  </button>
  <div class="header__control">
    <app-realtime-status></app-realtime-status>
    <div class="language-control">
      <button type="button" class="language-trigger" [matMenuTriggerFor]="languageMenu" [attr.aria-label]="'header.language' | translate">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.92 6h-2.95a15.7 15.7 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8ZM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96ZM4.26 14a8.2 8.2 0 0 1 0-4h3.38a16.5 16.5 0 0 0 0 4H4.26Zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A8.03 8.03 0 0 1 5.08 16Zm2.95-8H5.08a8.03 8.03 0 0 1 4.33-3.56A15.7 15.7 0 0 0 8.03 8ZM12 19.96A14.1 14.1 0 0 1 10.09 16h3.82A14.1 14.1 0 0 1 12 19.96ZM14.34 14H9.66a14.7 14.7 0 0 1 0-4h4.68a14.7 14.7 0 0 1 0 4Zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56ZM16.36 14a16.5 16.5 0 0 0 0-4h3.38a8.2 8.2 0 0 1 0 4h-3.38Z"/></svg>
        <span>{{ language.current.code | uppercase }}</span>
      </button>
      <mat-menu #languageMenu="matMenu" class="vx-account-overlay" xPosition="before">
        <button mat-menu-item class="account-menu-item" *ngFor="let lang of language.languages" (click)="useLanguage(lang.code)"
          [class.active]="lang.code === language.current.code" [attr.lang]="lang.code" [attr.aria-current]="lang.code === language.current.code">
          <span>{{ lang.label }}</span>
        </button>
      </mat-menu>
    </div>
    <app-navbar-notifications></app-navbar-notifications>
    <div class="account-control">
      <button type="button" class="account-trigger" [matMenuTriggerFor]="accountMenu" [attr.aria-label]="'header.accountMenu' | translate">
        <img *ngIf="imageUrl; else initials" [src]="imageUrl" (error)="onImageError()" [attr.alt]="'header.profilePhoto' | translate">
        <ng-template #initials><span class="avatar-initials">{{ userInitials }}</span></ng-template>
      </button>
      <mat-menu #accountMenu="matMenu" class="vx-account-overlay" xPosition="before">
        <div class="account-summary">
          <span class="account-avatar"><img *ngIf="imageUrl; else menuInitials" [src]="imageUrl" (error)="onImageError()" alt=""><ng-template #menuInitials>{{ userInitials }}</ng-template></span>
          <div>
            <span class="account-eyebrow">{{ 'header.signedInAs' | translate }}</span>
            <strong>{{ user.firstName }} {{ user.lastName }}</strong>
            <span class="account-email">{{ user.email }}</span>
            <small>{{ ('roles.' + user.role) | translate }}</small>
          </div>
        </div>
        <div class="account-menu-actions">
          <button mat-menu-item class="account-menu-item" (click)="goToProfile()"><span>{{ 'header.myProfile' | translate }}</span></button>
          <button mat-menu-item class="account-menu-item" *ngIf="access.isAdmin" routerLink="/dashboard/users"><span>{{ 'header.manageUsers' | translate }}</span></button>
        </div>
        <div class="account-divider"></div>
        <button mat-menu-item class="account-menu-item signout-action" (click)="logout()"><svg class="icon" aria-hidden="true"><use xlink:href="#icon-arrow-right"></use></svg><span>{{ 'header.signOut' | translate }}</span></button>
      </mat-menu>
    </div>
  </div>
</header>
