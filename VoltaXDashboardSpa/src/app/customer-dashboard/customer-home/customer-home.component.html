<div class="overlay"></div>
<!-- inner-->
<div class="page__inner">
  <div class="page__container">
    <div class="page__title h3">My Dashboard</div>

    <!-- Welcome Card -->
    <div class="card welcome__card">
      <!-- Welcoming message -->
      <p class="welcome">Hello back my friend mohammed chanaa ! </p>

      <!-- Warnings and very important alerts -->
      <p class="warning">You must complete your profile before you can use our services ! <button>complete profile</button> </p>
    </div>
    
    <!-- Chargers Overview -->
    <div class="card">
      <div class="card__head">
        <div class="title-purple card__title">My Recharge Cards</div>
      </div>
      <div>
        <ngx-slick-carousel class="carousel" 
        #slickModal="slick-carousel" 
        [config]="slideConfig" 
        (init)="slickInit($event)"
        (breakpoint)="breakpoint($event)"
        (afterChange)="afterChange($event)"
        (beforeChange)="beforeChange($event)">
          <div ngxSlickItem *ngFor="let rechargeCard of rechargeCards" class="slide">
            <app-recharge-card ></app-recharge-card>
          </div>
      </ngx-slick-carousel>
        
      </div>
    </div>

    

    
  </div>
</div>
