<div class="title-green request__title">Set Network Profile Request</div>
<div class="request__subtitle">Description</div>
<div class="request__description">
  Set the network profile of the charging station.
</div>

<div class="request__container">
  
  <div class="field">
    <div class="field__label">Severity
      <div class="tooltip" title="The Charging Station SHALL only report events with a severity number lower than or equal to this severity.\r\nThe severity range is 0-9, with 0 as the highest and 9 as the lowest severity level.\r\n\r\nThe severity levels have the following meaning: +\r\n*0-Danger* +\r\nIndicates lives are potentially in danger. Urgent attention is needed and action should be taken immediately. +\r\n*1-Hardware Failure* +\r\nIndicates that the Charging Station is unable to continue regular operations due to Hardware issues. Action is required. +\r\n*2-System Failure* +\r\nIndicates that the Charging Station is unable to continue regular operations due to software or minor hardware issues. Action is required. +\r\n*3-Critical* +\r\nIndicates a critical error. Action is required. +\r\n*4-Error* +\r\nIndicates a non-urgent error. Action is required. +\r\n*5-Alert* +\r\nIndicates an alert event. Default severity for any type of monitoring event.  +\r\n*6-Warning* +\r\nIndicates a warning event. Action may be required. +\r\n*7-Notice* +\r\nIndicates an unusual event. No immediate action is required. +\r\n*8-Informational* +\r\nIndicates a regular operational event. May be used for reporting, measuring throughput, etc. No action is required. +\r\n*9-Debug* +\r\nIndicates information useful to developers for debugging, not useful during operations.">
        <svg class="icon icon-info">
          <use xlink:href="#icon-info"></use>
        </svg>
      </div>
    </div>
    <div class="field__wrap">
      <div class="field__wrap">
        <input 
          [(ngModel)]="request.severity" 
          placeholder="ID" 
          class="field__input" type="text" required>
      </div>
    </div>
  </div>

  <div class="field">
    <div class="field__label">Ocpp Csms URL
      <div class="tooltip" title="URL of the CSMS(s) that this Charging Station  communicates with.">
        <svg class="icon icon-info">
          <use xlink:href="#icon-info"></use>
        </svg>
      </div>
    </div>
    <div class="field__wrap">
      <div class="field__wrap">
        <input 
          [(ngModel)]="request.connectionData.ocppCsmsUrl" 
          placeholder="Ocpp Csms URL" 
          class="field__input" type="text" required>
      </div>
    </div>
  </div>

  <div class="field">
    <div class="field__label">Ocpp message timeout
      <div class="tooltip" title="Duration in seconds before a message send by the Charging Station via this network connection times-out.\r\nThe best setting depends on the underlying network and response times of the CSMS.\r\nIf you are looking for a some guideline: use 30 seconds as a starting point.">
        <svg class="icon icon-info">
          <use xlink:href="#icon-info"></use>
        </svg>
      </div>
    </div>
    <div class="field__wrap">
      <div class="field__wrap">
        <input 
          [(ngModel)]="request.connectionData.messageTimeout" 
          placeholder="OCPP Message Timeout" 
          class="field__input" type="text" required>
      </div>
    </div>
  </div>

  <div class="field">
    <div class="field__label">Security Profile
      <div class="tooltip" title="This field specifies the security profile used when connecting to the CSMS with this NetworkConnectionProfile..">
        <svg class="icon icon-info">
          <use xlink:href="#icon-info"></use>
        </svg>
      </div>
    </div>
    <div class="field__wrap">
      <div class="field__wrap">
        <input 
          [(ngModel)]="request.connectionData.securityProfile" 
          placeholder="Security Profile" 
          class="field__input" type="text" required>
      </div>
    </div>
  </div>

  <div class="field">
    <div class="field__label">Ocpp Transport
      <div class="tooltip" title="Defines the transport protocol (e.g. SOAP or JSON). Note: SOAP is not supported in OCPP 2.0, but is supported by other versions of OCPP.">
        <svg class="icon icon-info">
          <use xlink:href="#icon-info"></use>
        </svg>
      </div>
    </div>
    <div class="field__wrap">
      <div class="field__wrap">
        <select [(ngModel)]="request.connectionData.ocppTransport"  class="select select_small" >
          <option value="JSON"> JSON </option>
          <option value="SOAP"> SOAP </option>
        </select>
      </div>
    </div>
  </div>

  <div class="field">
    <div class="field__label">Ocpp Interface
      <div class="tooltip" title="Applicable Network Interface">
        <svg class="icon icon-info">
          <use xlink:href="#icon-info"></use>
        </svg>
      </div>
    </div>
    <div class="field__wrap">
      <div class="field__wrap">
        <select [(ngModel)]="request.connectionData.ocppInterface"  class="select select_small" >
          <option value="Wired0"> Wired0 </option>
          <option value="Wired1"> Wired1 </option>
          <option value="Wired2"> Wired2 </option>
          <option value="Wired3"> Wired3 </option>
          <option value="Wireless0"> Wireless0 </option>
          <option value="Wireless1"> Wireless1 </option>
          <option value="Wireless2"> Wireless2 </option>
          <option value="Wireless3"> Wireless3 </option>
        </select>
      </div>
    </div>
  </div>

<div class="form__actions">
  <button (click)="setNetworkProfile()" class="button button__primary button-small stop__btn">
    <ng-container *ngIf="isLoading">
      <app-svg-spinner></app-svg-spinner>
    </ng-container>
    <ng-container *ngIf="!isLoading">Set Network Profile Request</ng-container>
  </button>
</div>
</div>
