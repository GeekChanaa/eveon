<div class="title-green request__title">Request Start Transaction Request</div>
<div class="request__subtitle">Description</div>
<div class="request__description">
  Requests a transaction start.
</div>
<div class="request__container">

  <div class="filters">
    <div (click)="filterCards('Active')" 
      [ngClass]="{'active' : cardStatusFilter == 'Active'}" 
      class="card__filter">Active</div>
    <div (click)="filterCards('Inactive')" 
      [ngClass]="{'active' : cardStatusFilter == 'Inactive'}" 
      class="card__filter">Inactive</div>
    <div (click)="filterCards('Blocked')" 
      [ngClass]="{'active' : cardStatusFilter == 'Blocked'}" 
      class="card__filter">Blocked</div>
    <div (click)="filterCards('Expired')" 
      [ngClass]="{'active' : cardStatusFilter == 'Expired'}" 
      class="card__filter">Expired</div>

    <div class="card__filter_search">
      <div class="field">
        <input (change)="filterCards(cardStatusFilter)" [(ngModel)]="filterCardName" type="text" placeholder="search card by owner name" class="field__input" >
      </div>
    </div>
  </div>
  <div class="field">
    <div class="field__label">Card ID (TokenID)
      <div class="tooltip" title="Contains a case insensitive identifier to use for the authorization and the type of authorization to support multiple forms of identifiers.">
        <svg class="icon icon-info">
          <use xlink:href="#icon-info"></use>
        </svg>
      </div>
    </div>
    <div class="field__wrap">
      <div class="field__wrap">
        <select [(ngModel)]="tokenID"  class="select select_small" >
          <option value="">None</option>
          <option *ngFor="let card of filteredCards" value="{{card.cardNumber}}">{{card.cardNumber+" "+card.userName}} </option>
        </select>
      </div>
    </div>

  </div>

  <div class="field">
    <div class="field">
      <div class="field__label">Remote Start ID
        <div class="tooltip" title="Id given by the server to this start request. The Charging Station might return this in the &lt;&lt;transactioneventrequest, TransactionEventRequest&gt;&gt;, letting the server know which transaction was started for this request. Use to start a transaction.">
          <svg class="icon icon-info">
            <use xlink:href="#icon-info"></use>
          </svg>
        </div>
      </div>
      <div class="field__wrap">
        <div class="field__wrap">
          <input [(ngModel)]="remoteStartID" placeholder="Remote Start ID" class="field__input" type="text" required>
        </div>
      </div>
  
    </div>

  </div>
  <div class="form__actions">
    <button 
      [disabled]="!isValid()" 
      [ngClass]="{'disabled' : !isValid()}" 
      (click)="startTransaction()" 
      class="button button__primary button-small stop__btn">
      Start Transaction
    </button>
  </div>
</div>
