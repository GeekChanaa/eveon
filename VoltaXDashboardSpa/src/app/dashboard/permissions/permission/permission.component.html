<app-dashboard-details-container [title]="permission?.name || 'Permission Details'" [breadcrumbs]="[
  { label: 'Dashboard', link: '/dashboard' },
  { label: 'Permission', link: '/dashboard/permissions' },
  { label: permission?.name || 'Details' }
]">

  <!-- Loading state -->
  <div *ngIf="!permissionLoaded" class="loading-container">
    <app-svg-spinner></app-svg-spinner>
  </div>

  <!-- Content area -->
  <div *ngIf="permissionLoaded" class="content-area">
    <!-- Tabs navigation -->
    <div class="tabs-container">
      <div class="tabs">
        <button [ngClass]="{'active': tabsEnum === 'InformationsTab'}" (click)="changeTab('InformationsTab')"
          class="tab-button">
          Information
        </button>
        <button [ngClass]="{'active': tabsEnum === 'RolesTab'}" (click)="changeTab('RolesTab')"
          class="tab-button">
          Roles that own this permission
        </button>
      </div>
    </div>

    <!-- Tab content -->
    <div class="tab-content">
      <!-- Information Tab -->
      <div *ngIf="tabsEnum === 'InformationsTab'" class="information-tab">
        <div class="card profile-section">
          
          <div class="card-content">

            <!-- Main details -->
            <div class="form-content">
              
              <div class="form-section">
                <h3 class="section-title">Configurations</h3>
                
                <app-display-cell 
                  [updateObservable]="updatepermissionObservable.bind(this)" 
                  [object]="permission"
                  [editable]="false"
                  inpType="text"
                  title="Name"
                  val="{{permission.name}}"></app-display-cell>

                <app-display-cell 
                  [updateObservable]="updatepermissionObservable.bind(this)" 
                  [object]="permission"
                  [editable]="false"
                  inpType="text"
                  title="Description"
                  val="{{permission.description}}"></app-display-cell>


              

              
            </div>
          </div>
        </div>
      </div>
      </div>

      <!-- Permission Tab -->
      <div *ngIf="tabsEnum === 'RolesTab'" class="charging-stations-tab">
        <div class="card">
          <div class="card-content">
            <ng-container *ngIf="permissionID != null && permissionID != undefined">
              <app-permission-roles [permissionID]="permissionID"></app-permission-roles>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-dashboard-details-container>
