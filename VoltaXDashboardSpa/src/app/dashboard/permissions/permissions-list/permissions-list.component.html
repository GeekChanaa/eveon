<div class="page__inner">
    <div class="page__container">
      <app-table-list 
        name="permission"
        names="permissions"
        [searchable]="false"
        routeName="permissions"
        createLink="/dashboard/permissions/create"
        [fields]="fields" 
        [getItemsObservable]="getPermissionsObservable.bind(this)"
        [deleteItemObservable]="deletePermissionObservable.bind(this)"
        [updateItemObservable]="updatePermissionObservable.bind(this)"
        [createLink]="''"
        [deletable]="false"
        [breadcrumbs]="[
          { label: 'Dashboard', link: '/dashboard' },
          { label: 'Permissions'}
        ]"
        >
      </app-table-list>
    </div>
  </div>
