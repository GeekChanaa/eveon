<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="charge cards"
      names="charge cards"
      [searchByAttributes]="['CardNumber','Note']"
      routeName="charging-cards"
      createLink=""
      [fields]="fields" 
      [deletable]="false"
      [filterDefs]="filterDefs"
      [getItemsObservable]="getCardsObservable.bind(this)"
      [deleteItemObservable]="deleteCardObservable.bind(this)"
      [updateItemObservable]="updateCardObservable.bind(this)"
      searchByPlaceHolder="Search by card number or note"
      [breadcrumbs]="[
        { label: 'Dashboard', link: '/dashboard' },
        { label: 'Charging Cards'}
      ]"
      >
    </app-table-list>
  </div>
</div>
