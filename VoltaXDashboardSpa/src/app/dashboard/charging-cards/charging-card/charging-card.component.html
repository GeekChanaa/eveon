<div class="page__inner">
  <div class="page__container">
    <div class="page__title h3">Recharge Card : {{card.name}}</div>
    <div class="settings">
      <div class="settings__menu">
        <button (click)="changeTab('InformationsTab')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'InformationsTab'}">Informations</button>

        <button (click)="changeTab('Transactions')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'Transactions'}">Transactions</button>

        <button (click)="changeTab('Orders')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'Orders'}">Orders</button>
        
      </div>
      <div class="settings__wrapper">
        <select class="select">
          <option (click)="changeTab('InformationsTab')">Informations</option>
          <option (click)="changeTab('Transactions')">Transactions</option>
          <option (click)="changeTab('Orders')">Orders</option>
        </select>
        <div class="settings__list">
          <div class="settings__item" *ngIf="tabsEnum == 'InformationsTab'">
            <div class="settings__anchor" id="basics" data-value="Basics"></div>
            <div class="title-green settings__title">Informations</div>
            <div class="settings__profile">

            </div>
            <div class="settings__fieldset">
              <ng-container *ngIf="cardLoaded">
                
                <app-display-cell 
                  [updateObservable]="updateCardObservable.bind(this)" 
                  [object]="card"
                  inpType="text"
                  title="Card Owner"
                  [editable]="false"
                  [link]="'/dashboard/users/'+card.userID"
                  [isLink]="true"
                  [val]="card.userName" [editable]="false"></app-display-cell>

                <app-display-cell 
                  [updateObservable]="updateCardObservable.bind(this)" 
                  [object]="card"
                  inpType="number"
                  title="maxCount"
                  [val]="card.maxCount"></app-display-cell>
                
                <app-display-cell 
                  [updateObservable]="updateCardObservable.bind(this)" 
                  [object]="card"
                  inpType="number"
                  title="balance"
                  [val]="card.balance"></app-display-cell>
                
                <app-display-cell 
                  [updateObservable]="updateCardObservable.bind(this)" 
                  [object]="card"
                  inpType="select_enum"
                  enumName="CardType"
                  title="cardType"
                  val="{{card.cardType}}"></app-display-cell>
                
                <app-display-cell 
                    [updateObservable]="updateCardObservable.bind(this)" 
                    [object]="card"
                    inpType="select_enum"
                    title="status"
                    enumName="CardStatus" 
                    val="{{card.status}}"></app-display-cell>
                
                <app-display-cell 
                  [updateObservable]="updateCardObservable.bind(this)" 
                  [object]="card"
                  inpType="text"
                  title="expirationDate"
                  val="{{card.expirationDate}}"></app-display-cell>
                
                <app-display-cell 
                  [updateObservable]="updateCardObservable.bind(this)" 
                  [object]="card"
                  inpType="text"
                  title="note"
                  val="{{card.note}}"></app-display-cell>
              </ng-container>
              
            </div>
          </div>
          <div class="settings__item" *ngIf="tabsEnum == 'Transactions'">
            <ng-container *ngIf="card.id != null && card.id != undefined">
              <app-charging-card-transactions [cardID]="card.id"></app-charging-card-transactions>
            </ng-container>
            
          </div>

          <div class="settings__item" *ngIf="tabsEnum == 'Orders'">
            <ng-container *ngIf="card.id != null && card.id != undefined">
              <app-charging-card-orders  [cardID]="card.id"></app-charging-card-orders>
            </ng-container>
            
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
