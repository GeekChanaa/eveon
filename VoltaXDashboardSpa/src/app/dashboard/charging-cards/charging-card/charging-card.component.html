<app-dashboard-details-container [title]="card?.name || 'Card Details'" [breadcrumbs]="[
  { label: 'Dashboard', link: '/dashboard' },
  { label: 'Charging Cards', link: '/dashboard/charging-cards' },
  { label: card?.id || 'Details' }
]">

  <!-- Loading state -->
  <div *ngIf="!cardLoaded" class="loading-container">
    <app-svg-spinner></app-svg-spinner>
  </div>

  <!-- Content area -->
  <div *ngIf="cardLoaded" class="content-area">
    <!-- Tabs navigation -->
    <div class="tabs-container">
      <div class="tabs">
        <button [ngClass]="{'active': tabsEnum === 'InformationsTab'}" (click)="changeTab('InformationsTab')"
          class="tab-button">
          Information
        </button>
        <button [ngClass]="{'active': tabsEnum === 'Transactions'}" (click)="changeTab('Transactions')"
          class="tab-button">
          Transactions
        </button>
        <button [ngClass]="{'active': tabsEnum === 'Orders'}" (click)="changeTab('Orders')"
          class="tab-button">
          Orders
        </button>
      </div>
    </div>

    <!-- Tab content -->
    <div class="tab-content">
      <!-- Information Tab -->
      <div *ngIf="tabsEnum === 'InformationsTab'" class="information-tab">
        <div class="card profile-section">
          
          <div class="card-content">

            <!-- Main details -->
            <div class="form-content">
              
              <div class="form-section">
                <h3 class="section-title">Informations</h3>
                <div class="field-group">
                  <app-display-cell 
                    [updateObservable]="updateCardObservable.bind(this)" 
                    [object]="card"
                    inpType="text"
                    title="Card Owner"
                    [tooltip]="'This is the name of the owner of the card'"
                    [editable]="false"
                    [link]="'/dashboard/users/'+card.userID"
                    [isLink]="true"
                    [val]="card.userName" [editable]="false"></app-display-cell>

                  <app-display-cell 
                    [updateObservable]="updateCardObservable.bind(this)" 
                    [tooltip]="'The maximum total value that can be loaded onto this card.'"
                    [object]="card"
                    inpType="number"
                    title="Max Count"
                    [val]="card.maxCount"></app-display-cell>
                  
                  <app-display-cell 
                    [updateObservable]="updateCardObservable.bind(this)" 
                    [object]="card"
                    [tooltip]="'The current available funds on your card.'"
                    inpType="number"
                    title="balance"
                    [val]="card.balance"></app-display-cell>

                  <app-display-cell 
                    [updateObservable]="updateCardObservable.bind(this)" 
                    [object]="card"
                    inpType="date"
                    [tooltip]="'The date of the expiration of the recharge card.'"
                    title="Expiration Date"
                    val="{{card.expirationDate}}"></app-display-cell>
                </div>
                
              </div>
              
              <!-- Address Information -->
              <div class="form-section">
                <h3 class="section-title">Configurations</h3>
                <div class="field-group">
                  <app-display-cell 
                    [updateObservable]="updateCardObservable.bind(this)" 
                    [object]="card"
                    [tooltip]="'The category of card, indicating its features and usage.'"
                    inpType="select_enum"
                    enumName="CardType"
                    title="Card Type"
                    val="{{card.cardType}}"></app-display-cell>
                  
                  <app-display-cell 
                      [updateObservable]="updateCardObservable.bind(this)" 
                      [object]="card"
                      inpType="select_enum"
                      title="Status"
                      [tooltip]="'The current status of the recharge card'"
                      enumName="CardStatus" 
                      val="{{card.status}}"></app-display-cell>

                  <app-display-cell 
                    [updateObservable]="updateCardObservable.bind(this)" 
                    [object]="card"
                    [tooltip]="'Additional informations about this recharge card.'"
                    inpType="text"
                    title="note"
                    val="{{card.note}}"></app-display-cell>
                </div>
                
              </div>

              

              
            </div>
          </div>
        </div>
      </div>

      <!-- Transactions Tab -->
      <div *ngIf="tabsEnum === 'Transactions'" class="charging-stations-tab">
        <div class="card">
          <div class="card-content">
            <ng-container *ngIf="card.id != null && card.id != undefined">
              <!-- <app-charging-station-charge-points [cardID]="card.id"></app-charging-station-charge-points> -->
            </ng-container>
          </div>
        </div>
      </div>

      <!-- Orders Tab -->
      <div *ngIf="tabsEnum === 'Orders'" class="charging-stations-tab">
        <div class="card">
          <div class="card-content">
            <ng-container *ngIf="card.id != null && card.id != undefined">
              <!-- <app-charging-station-charge-points [cardID]="card.id"></app-charging-station-charge-points> -->
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-dashboard-details-container>
