<app-dashboard-details-container 
  [state]="state"
  [title]="chargePoint?.name || 'Charge Point Details'" [breadcrumbs]="[
  { label: 'Dashboard', link: '/dashboard' },
  { label: 'Charge Points', link: '/dashboard/charging-points' },
  { label: chargePoint?.name || 'Details' }
]">

  <!-- Loading state -->
  <div *ngIf="!chargePointLoaded" class="loading-container">
    <app-svg-spinner></app-svg-spinner>
  </div>

  <!-- Content area -->
  <div *ngIf="chargePointLoaded" class="content-area">
    <!-- Tabs navigation -->
    <div class="tabs-container">
      <div class="tabs">
        <button [ngClass]="{'active': tabsEnum === 'InformationsTab'}" (click)="changeTab('InformationsTab')"
          class="tab-button">
          Information
        </button>
        <button [ngClass]="{'active': tabsEnum === 'ConnectorsTab'}" (click)="changeTab('ConnectorsTab')"
          class="tab-button">
          Connectors
        </button>
      </div>
    </div>

    <!-- Tab content -->
    <div class="tab-content">
      <!-- Information Tab -->
      <div *ngIf="tabsEnum === 'InformationsTab'" class="information-tab">
        <div class="card profile-section">

          <div class="card-content">

            <!-- Main details -->
            <div class="form-content">

              <div class="form-section">
                <h3 class="section-title">Basic Informations</h3>
                <div class="field-group">
                  <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                    [editable]="false" inpType="text" title="Charge Point ID"
                    val="{{chargePoint.chargePointId}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                    [editable]="false" inpType="text" title="Charging Station Name"
                    val="{{chargePoint.chargingStationName}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                    inpType="text" title="Serial Number" val="{{chargePoint.serialNumber}}"></app-display-cell>
                  <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                    inpType="select" title="chargePointBrandID" [options]="chargePointBrandsOptions" val="{{chargePoint.make}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                    inpType="select" title="chargePointModelID" [options]="chargePointModelsOptions" val="{{chargePoint.modelName}}"></app-display-cell>



                </div>

              </div>

              <!-- Address Information -->
              <div class="form-section">
                <h3 class="section-title">Configuration</h3>
                <div class="field-group">
                  <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                  inpType="select_enum" title="Charge Point Status" enumName="ChargePointStatus"
                  val="{{chargePoint.status}}"></app-display-cell>

                <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                  inpType="select_enum"  title="Charge Point Category" enumName="ChargePointCategory"
                  val="{{chargePoint.category}}"></app-display-cell>

                <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                  inpType="text"  title="Username"
                  val="{{chargePoint.username}}"></app-display-cell>

                <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                  inpType="text"  title="Password"
                  val="{{chargePoint.password}}"></app-display-cell>

                <app-display-cell [updateObservable]="updateChargePointObservable.bind(this)" [object]="chargePoint"
                  inpType="text"  title="Comment"
                  val="{{chargePoint.comment}}"></app-display-cell>
                </div>


              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Connectors Tab -->
      <div *ngIf="tabsEnum === 'ConnectorsTab'" class="charging-stations-tab">
        <div class="card">
          <div class="card-content">
            <ng-container *ngIf="chargePoint.id != null && chargePoint.id != undefined">
              <app-charge-point-connectors [chargePointID]="chargePoint.id"></app-charge-point-connectors>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-dashboard-details-container>
