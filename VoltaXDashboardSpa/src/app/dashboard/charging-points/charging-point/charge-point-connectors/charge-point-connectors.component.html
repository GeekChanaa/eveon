<section class="connector-management" *ngIf="!isConnectorVisible">
  <header class="section-header">
    <div><h2>Connectors <span *ngIf="!loading && !loadError" class="count">{{ connectors.length }}</span></h2><p>Select a connector to view its configuration and pricing.</p></div>

  </header>
  <div class="empty-state" *ngIf="loading" role="status"><app-svg-spinner></app-svg-spinner><p>Loading connectors...</p></div>
  <div class="empty-state" *ngIf="loadError" role="alert"><h3>Could not load connectors</h3><p>Please try again.</p><button type="button" (click)="getChargePointConnectors()">Retry</button></div>
  <div class="empty-state" *ngIf="!loading && !loadError && !connectors.length">
    <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-width="1.5" d="M13 3 4 14h7v7l9-11h-7V3Z"/></svg>
    <h3>No connectors yet</h3><p>Connectors will appear here when they are configured for this charge point.</p>
  </div>
  <div class="connector-grid" *ngIf="!loading && !loadError && connectors.length">
    <button type="button" *ngFor="let point of connectors" class="connector-card" (click)="showConnector(point.id)">
      <span class="connector-icon"><svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-width="1.6" d="M13 3 4 14h7v7l9-11h-7V3Z"/></svg></span>
      <span class="connector-copy"><strong>Connector {{ point.connectorID ?? point.id }}</strong><span>View configuration &amp; pricing</span></span>
      <svg class="card-arrow" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-width="1.6" d="m9 5 7 7-7 7"/></svg>
    </button>
  </div>
</section>
<div *ngIf="isConnectorVisible"><button type="button" class="back-button" (click)="isConnectorVisible = false">&larr; All connectors</button><app-charge-point-connector [connectorID]="displayedConnectorID" (refreshEvent)="refresh()"></app-charge-point-connector></div>
