<div class="settings__anchor" id="account" data-value="Account"></div>
<div class="connector-management" *ngIf="!isConnectorVisible">

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!cpfShow && connectors.length <= 0">
    <div class="empty-state__icon">
      <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
    <h3 class="empty-state__title">No Connectors Available</h3>
    <p class="empty-state__description">Get started by adding your first connector to this charge point.</p>
  </div>

  <!-- Connector Selection -->
  <div class="connector-selection" *ngIf="connectors.length > 0 && !cpfShow">
    <div class="section-header">
      <h3 class="section-title">Available Connectors</h3>
      <p class="section-description">Choose a connector to view and manage its settings</p>
    </div>

    <div class="connector-grid">
      <button *ngFor="let connector of connectors; let i = index" class="connector-card"
        (click)="showConnector(connector.id)">
        <div class="connector-card__icon">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div class="connector-card__content">
          <h4 class="connector-card__title">Connector {{connector.id}}</h4>
          <span class="connector-card__status">Available</span>
        </div>
        <div class="connector-card__arrow">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      </button>
    </div>
  </div>

  <!-- Add Connector Form -->
  <div class="add-connector-section" *ngIf="cpfShow && chargePointID != null && chargePointID != undefined">
    <app-charge-point-add-connector [chargePointID]="chargePointID" (successEvent)="refresh()"
      (cancelEvent)="cpfShow = false">
    </app-charge-point-add-connector>
  </div>

  <!-- Action Button -->
  <!-- <div class="action-section" *ngIf="!cpfShow">
    <app-button variant="primary" class="add-connector-btn" (btnClick)="cpfShow = true">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
      Add New Connector
    </app-button>
  </div> -->
</div>

<!-- Connector Details View -->
<div class="connector-details" *ngIf="isConnectorVisible">
  <app-charge-point-connector [connectorID]="displayedConnectorID" (refreshEvent)="refresh()">
  </app-charge-point-connector>
</div>
