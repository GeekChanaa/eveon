<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="charge point"
      names="charge points"
      [searchByAttributes]="['ChargePointId','Address']"
      routeName="charging-points"
      createLink="/dashboard/charging-points/create"
      [fields]="fields" 
      [filters]="filters"
      [getItemsObservable]="getChargePointsObservable.bind(this)"
      [deleteItemObservable]="deleteChargePointObservable.bind(this)"
      [updateItemObservable]="updateChargePointObservable.bind(this)"
      searchByPlaceHolder="Search by ChargePointID"
      (resetFiltersEvent)="resetFilters()"
      [breadcrumbs]="[
        { label: 'Dashboard', link: '/dashboard' },
        { label: 'Charge Points'}
      ]"
      >
      <button list__actions *ngIf="access.can('EditChargePoints')" type="button" class="list-tool"
        [disabled]="regeneratingQrCodes" (click)="requestRegenerateAllQrCodes()">
        <svg class="list-tool__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5" /></svg>
        <span>{{ regeneratingQrCodes ? 'Regenerating...' : 'Regenerate QR codes' }}</span>
      </button>

      <!-- filter body -->
      <ng-container filter__body>
        <div  class="filters__group">
        
          <div class="filters__item">
            <div class="filters__list">
              <div class="field">
                <div class="field__label">By City
                  <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                    <svg class="icon icon-info">
                      <use xlink:href="#icon-info"></use>
                    </svg>
                  </div>
                </div>
                <div class="field__wrap">
                  <div class="field__wrap">
                    <select class="select" [(ngModel)]="filters.city">
                      <option value="" selected>None</option>
                      <option value="{{city.name}}" *ngFor="let city of cities">{{city.name}}</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="field">
                <div class="field__label">By Category
                  <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                    <svg class="icon icon-info">
                      <use xlink:href="#icon-info"></use>
                    </svg>
                  </div>
                </div>
                <div class="field__wrap">
                  <div class="field__wrap">
                    <select class="select" [(ngModel)]="filters.category">
                      <option value="" selected>None</option>
                      <option value="Public">Public</option>
                      <option value="Private">Private</option>
                      <option value="Partner">Partner</option>
                    </select>
                  </div>
                </div>
              </div>

              
            </div>
          </div>
          
        </div>
      </ng-container>


      <ng-template appTableCustomButton let-item>
        <a *ngIf="needsSetup(item) && access.canUrl('/dashboard/charge-point-configurations')" class="table__action setup-btn"
          [routerLink]="['/dashboard/charge-point-configurations', item.chargePointId, 'setup']"
          title="Configure this charge point" [attr.aria-label]="'Configure ' + item.chargePointId">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="12" cy="12" r="3" stroke-width="1.8"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </ng-template>
    </app-table-list>
  </div>
</div>
