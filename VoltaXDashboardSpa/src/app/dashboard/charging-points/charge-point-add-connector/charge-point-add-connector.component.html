<form [formGroup]="connectorForm">
  
  <app-form-field
    class="field"
    title="Connector ID"
    description="tbd"
    [control]="getControl('connectorID')"
  ></app-form-field>

  <app-form-field
    class="field"
    title="EVSE ID"
    description="tbd"
    [control]="getControl('evseID')"
  ></app-form-field>

  <div class="field">
    <div class="field__label">Speed
      <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
        <svg class="icon icon-info">
          <use xlink:href="#icon-info"></use>
        </svg>
      </div>
    </div>
    <div class="field__wrap">
      <div class="field__wrap">
        <select class="select" formControlName="speed">
          <option value="7.3">7.3 KWh</option>
          <option value="11">11 KWh</option>
          <option value="22">22 KWh</option>
          <option value="43">43 KWh</option>
        </select>
      </div>
    </div>
  </div>

  <app-form-field
    class="field"
    title="Price Per Kwh"
    description="tbd"
    [control]="getControl('pricePerKWh')"
  ></app-form-field>

  <app-form-field
    class="field"
    title="Price Per Minute"
    description="tbd"
    [control]="getControl('pricePerMinute')"
  ></app-form-field>

  <app-form-field
    class="field"
    title="Price Per Idle Minute"
    description="tbd"
    [control]="getControl('pricePerIdleMinute')"
  ></app-form-field>

  <app-form-field
    class="field"
    title="Price Per Hour"
    description="tbd"
    [control]="getControl('pricePerHour')"
  ></app-form-field>

  <app-form-field
    class="field"
    title="Flat Fee"
    description="tbd"
    [control]="getControl('flatFee')"
  ></app-form-field>

  <app-form-field
    class="field"
    title="Cost Per Kwh"
    description="tbd"
    [control]="getControl('costPerKwh')"
  ></app-form-field>

  <div class="flex form__actions">
    <button (click)="cpfOnSubmit()" class="button submit__button">Create</button>
    <button (click)="cancelEvent.emit()" class="button-stroke btn-cancel">
      Cancel
    </button>
  </div>
</form>
