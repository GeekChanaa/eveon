<section class="connector-editor">
  <header><h2>Edit connector</h2><p>Update the port identifiers and pricing, then save your changes.</p></header>
  <p *ngIf="loading" role="status">Loading connector...</p>
  <div *ngIf="loadError" role="alert"><p>Could not load the connector.</p><button type="button" class="secondary-action" (click)="getConnector()">Retry</button></div>
  <form *ngIf="!loading && !loadError" [formGroup]="connectorForm" (ngSubmit)="cpfOnSubmit()" [attr.aria-busy]="saving">
    <div class="editor-grid"><div class="editor-field" *ngFor="let field of fields">
      <label [for]="'connector-' + field.key">{{ field.label }}</label>
      <select *ngIf="field.key === 'speed'; else numberInput" [id]="'connector-' + field.key" [formControlName]="field.key" [attr.aria-invalid]="getControl(field.key).touched && getControl(field.key).invalid">
        <option *ngFor="let option of speedOptions" [ngValue]="option.value">{{ option.label }}</option>
      </select>
      <ng-template #numberInput><input type="number" min="0" [step]="field.key === 'connectorID' || field.key === 'evseID' ? '1' : 'any'" [id]="'connector-' + field.key" [formControlName]="field.key" [attr.aria-invalid]="getControl(field.key).touched && getControl(field.key).invalid"></ng-template>
      <p role="alert" *ngIf="getControl(field.key).touched && getControl(field.key).invalid">Enter a valid non-negative {{ field.key === 'connectorID' || field.key === 'evseID' ? 'whole number' : 'number' }}.</p>
    </div></div>
    <p class="field-error" role="alert" *ngIf="saveError">{{ saveError }}</p>
    <div class="edit-actions"><button type="button" class="secondary-action" [disabled]="saving" (click)="cancelEvent.emit()">Cancel</button><button type="submit" class="primary-action" [disabled]="saving || connectorForm.invalid">{{ saving ? 'Saving...' : 'Save changes' }}</button></div>
  </form>
  <button type="button" class="secondary-action" *ngIf="loading || loadError" (click)="cancelEvent.emit()">Cancel</button>
</section>
