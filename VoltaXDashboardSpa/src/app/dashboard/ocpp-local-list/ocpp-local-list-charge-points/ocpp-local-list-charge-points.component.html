<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="OCPP LocaL List"
      names="Ocpp Local List"
      [searchByAttributes]="['ChargePointId','SerialNumber']"
      routeName="charging-points"
      createLink="''"
      [fields]="fields" 
      [filterDefs]="filterDefs"
      [deletable]="false"
      [displayable]="false"
      [createLink]="''"
      [getItemsObservable]="getChargePointsObservable.bind(this)"
      searchByPlaceHolder="Search by charge point ID or serial number"
      >
      <ng-template appTableCustomButton let-item>
        <button class="table__action connector__btn" routerLink="/dashboard/ocpp-local-list/charge-point/{{item.id}}"> 
          <svg class="icon icon-info">
              <use xlink:href="#icon-info"></use>
          </svg>  
        </button>
      </ng-template>
      
    </app-table-list>
  </div>
</div>
