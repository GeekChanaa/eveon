<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="notice"
      names="notices"
      [searchByAttributes]="['Title']"
      routeName="notices"
      createLink="/dashboard/notices/create"
      [fields]="fields" 
      [filters]="filters"
      [getItemsObservable]="getNoticesObservable.bind(this)"
      [deleteItemObservable]="deleteNoticeObservable.bind(this)"
      [updateItemObservable]="updateNoticeObservable.bind(this)"
      searchByPlaceHolder="Search by Title"
      (resetFiltersEvent)="resetFilters()"
      [breadcrumbs]="[
        { label: 'Dashboard', link: '/dashboard' },
        { label: 'Notices'}
      ]"
      >
      <!-- filter body -->
      <ng-container filter__body>
        <div  class="filters__group">
        
          <div class="filters__item">
            <div class="filters__list">

              <div class="field">
                <div class="field__label">By Type
                  <div class="tooltip" title="The type of the notice">
                    <svg class="icon icon-info">
                      <use xlink:href="#icon-info"></use>
                    </svg>
                  </div>
                </div>
                <div class="field__wrap">
                  <div class="field__wrap">
                    <select class="select" [(ngModel)]="filters.type">
                      <option value="" selected>None</option>
                      <option value="LegalUpdate">Legal Update</option>
                      <option value="Marketing">Marketing</option>
                      <option value="Maintenance">Maintenance</option>
                    </select>
                  </div>
                </div>
              </div>

              
            </div>
          </div>
          
        </div>
      </ng-container>

      
    </app-table-list>
  </div>
</div>
