<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="report"
      names="reports"
      [searchByAttributes]="['ChargePoint.ChargePointId','IssueDescription','User.FirstName','User.LastName']"
      routeName="reports"
      createLink="/dashboard/reports/create"
      [fields]="fields" 
      [filterDefs]="filterDefs"
      [getItemsObservable]="getReportsObservable.bind(this)"
      [deleteItemObservable]="deleteReportObservable.bind(this)"
      [updateItemObservable]="updateReportObservable.bind(this)"
      searchByPlaceHolder="Search by charge point, description or reporter name"
      [breadcrumbs]="[
          { label: 'Dashboard', link: '/dashboard' },
          { label: 'Reports'}
        ]"
      >
    </app-table-list>
  </div>
</div>
