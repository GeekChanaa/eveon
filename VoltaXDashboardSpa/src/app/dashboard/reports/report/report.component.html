<app-dashboard-details-container [title]="report?.name || 'Report Details'" [breadcrumbs]="[
  { label: 'Dashboard', link: '/dashboard' },
  { label: 'Reports', link: '/dashboard/reports' },
  { label: report?.name || 'Details' }
]">

  <!-- Loading state -->
  <div *ngIf="!reportLoaded" class="loading-container">
    <app-svg-spinner></app-svg-spinner>
  </div>

  <!-- Content area -->
  <div *ngIf="reportLoaded" class="content-area">
    <!-- Tabs navigation -->
    <div class="tabs-container">
      <div class="tabs">
        <button class="active"
          class="tab-button">
          Informations
        </button>
      </div>
    </div>

    <!-- Tab content -->
    <div class="tab-content">
      <!-- Information Tab -->
      <div class="information-tab">
        <div class="card profile-section">

          <div class="card-content">

            <!-- Main details -->
            <div class="form-content">

              <div class="form-section">
                <h3 class="section-title">Basic Informations</h3>
                <div class="field-group">
                  <app-display-cell [updateObservable]="updateReportObservable.bind(this)" [object]="report"
                    inpType="text" title="Issue Description"
                    val="{{report.issueDescription}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateReportObservable.bind(this)" [object]="report"
                    inpType="date" title="Report Date"
                    val="{{report.reportDate}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateReportObservable.bind(this)" [object]="report"
                    inpType="date" title="Resolve Date"
                    val="{{report.resolveDate}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateReportObservable.bind(this)" [object]="report"
                    inpType="select_enum"  title="Report Category" enumName="ReportCategory"
                    val="{{report.reportCategory}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateReportObservable.bind(this)" [object]="report"
                    inpType="select_enum"  title="Report Category" enumName="ReportType"
                    val="{{report.reportType}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateReportObservable.bind(this)" [object]="report"
                    inpType="select_enum"  title="Report Category" enumName="ReportStatusEnum"
                    val="{{report.status}}"></app-display-cell>

                </div>
              </div>

              <div class="form-section">
                <h3 class="section-title">Entities related to the report</h3>
                <div class="field-group">
                  <app-display-cell [updateObservable]="updateReportObservable.bind(this)" [object]="report"
                    inpType="text" title="User"  [editable]="false"
                    val="{{report.userName}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateReportObservable.bind(this)" [object]="report"
                    inpType="text" title="Charge Point"  [editable]="false"
                    val="{{report.chargePointName}}"></app-display-cell>
                </div>


              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-dashboard-details-container>
