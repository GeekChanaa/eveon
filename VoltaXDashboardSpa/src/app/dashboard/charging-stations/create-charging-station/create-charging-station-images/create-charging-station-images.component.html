<!-- HTML Template -->
<div class="create__card card">
  <div class="file">
    <div class="file__label">Station gallery <span class="station-optional">Optional</span></div>
    <p class="station-upload-hint">Upload image files up to 2 MB each. You can add several photos.</p>
    <div class="file__wrap" 
         (dragover)="onDragOver($event)" 
         (dragleave)="onDragLeave($event)" 
         (drop)="onDrop($event)">
      <input #fileInput class="upload-input" type="file" multiple (change)="handleUpload($event)" style="display: none;" />
      <button type="button" class="file__box"
           [class.dragover]="isDragging" 
           *ngIf="chargingStationImages.length === 0"
           (click)="fileInput.click()">
        <svg class="icon icon-upload">
          <use xlink:href="#icon-upload"></use>
        </svg><strong>Choose photos or drag them here</strong><span>Show the station, its surroundings, and charging bays.</span>
      </button>
      <div class="files__box" *ngIf="chargingStationImages.length > 0">
        <div class="image__box" *ngFor="let imageUrl of displayedImages; let i = index">
          <button type="button" class="image__clear" (click)="clearImage(i)" [attr.aria-label]="'Remove photo ' + (i + 1)">&times;</button>
          <img [src]="imageUrl" alt="Charging station image">
        </div>
        <button type="button" class="add-more-images" (click)="fileInput.click()">
          <svg class="icon icon-plus">
            <use xlink:href="#icon-plus"></use>
          </svg>
          Add photos
        </button>
      </div>
      
    </div>
    <div role="alert" class="file__errors" *ngIf="fileErrors.length > 0">
      <div class="error-message" *ngFor="let error of fileErrors">{{ error }}</div>
    </div>


  </div>

  <div class="form__actions">
    <app-button
      (btnClick)="previousStep()"
      [outlined]="true">
        Previous
    </app-button>

    <app-button
      class="ml-auto"
      (btnClick)="saveInformations()"
      [disabled]="form.invalid"
      [variant]="'professional'">
        Next
    </app-button>
  </div>
</div>
