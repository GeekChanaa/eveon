<form [formGroup]="form">

  <div class="field__group">
    <app-search-input class="field"
      placeholder="City"
      title="City"
      description="The City where the charging station is."
      [control]="getControl('city')"
      [options]="cities"></app-search-input>
  
    <app-form-field
      class="field"
      title="Zip Code"
      inputType="text"
      description="The postal code for the address."
      placeholder="Enter Zip Code"
      [control]="getControl('zipCode')"
    ></app-form-field>
  </div>
  

  <app-form-field
    class="field"
    title="Address"
    inputType="text"
    description="The full street address."
    placeholder="Enter Street Address"
    [control]="getControl('address')"
  ></app-form-field>

  <div class="form__actions">
    <app-button
      (btnClick)="previousStep()"
      [outlined]="true">
        Previous
    </app-button>

    <app-button
      class="ml-auto"
      (btnClick)="saveInformations()"
      [disabled]="form.invalid"
      [variant]="'professional'">
        Next
    </app-button>

  </div>
</form>
