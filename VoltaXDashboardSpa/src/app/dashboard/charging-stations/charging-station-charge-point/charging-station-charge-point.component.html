<div class="head">
  <div class="head-name">
    Charge Point: <b>{{ chargePoint.chargePointId }}</b>
  </div>
  <div class="head-actions">
    <app-button
      [outlined]="true"
      variant="professional"
      size="small"
      class="edit-btn"
      [routerLink]="['/dashboard/charging-points', chargePoint.id]"
    >
      Edit
    </app-button>
    <app-button variant="danger" size="small" (btnClick)="confirmDelete()">
      Delete
    </app-button>
  </div>
</div>

<div class="card-display">
  <app-info-item title="Serial Number" [value]="chargePoint.serialNumber"></app-info-item>
  <app-info-item title="Make" [value]="chargePoint.make"></app-info-item>
  <app-info-item title="Status" [value]="chargePointStatus"></app-info-item>
  <app-info-item title="Comment" [value]="chargePoint.comment"></app-info-item>
  <app-info-item title="Username" [value]="chargePoint.username"></app-info-item>
  <app-info-item title="Password" [value]="chargePoint.password"></app-info-item>
  <app-info-item title="Client Certificate Thumb" [value]="chargePoint.clientCertThumb"></app-info-item>
  <app-info-item title="Category" [value]="chargePointCategory"></app-info-item>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" *ngIf="showDeleteConfirmModal">
  <div class="modal-content">
    <h3>Confirm Delete</h3>
    <p>Are you sure you want to delete this item?</p>
    <div class="modal-actions">
      <button (click)="cancelDelete()" class="btn-cancel">Cancel</button>
      <app-button variant="danger" size="small" (btnClick)="proceedWithDelete()">
        Delete
      </app-button>
    </div>
  </div>
</div>
