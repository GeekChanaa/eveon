<app-dashboard-details-container [state]="state" [title]="chargingStation?.name || 'Charging Station Details'"
  [breadcrumbs]="[
  { label: 'Dashboard', link: '/dashboard' },
  { label: 'Charging Stations', link: '/dashboard/charging-stations' },
  { label: chargingStation?.name || 'Details' }
]">

  <!-- Loading state -->
  <div *ngIf="!chargingStationLoaded" class="loading-container">
    <app-svg-spinner></app-svg-spinner>
  </div>

  <!-- Content area -->
  <div *ngIf="chargingStationLoaded" class="content-area">
    <!-- Tabs navigation -->
    <div class="tabs-container">
      <div class="tabs">
        <button [ngClass]="{'active': tabsEnum === 'InformationsTab'}" (click)="changeTab('InformationsTab')"
          class="tab-button">
          Information
        </button>
        <button [ngClass]="{'active': tabsEnum === 'ChargePointsTab'}" (click)="changeTab('ChargePointsTab')"
          class="tab-button">
          Charge Points
        </button>
        <button [ngClass]="{'active': tabsEnum === 'ImagesTab'}" (click)="changeTab('ImagesTab')" class="tab-button">
          Images
        </button>
      </div>
    </div>

    <!-- Tab content -->
    <div class="tab-content">
      <!-- Information Tab -->
      <div *ngIf="tabsEnum === 'InformationsTab'" class="information-tab">
        <div class="card profile-section">

          <div class="card-content">

            <!-- Main details -->
            <div class="form-content">

              <div class="form-section">
                <h3 class="section-title">Configurations</h3>
                <div class="field-group">
                  <app-display-cell [object]="chargingStation" [editable]="false" title="Partner"
                    val="{{chargingStation.partnerName}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateChargingStationObservable.bind(this)"
                    [object]="chargingStation" inpType="select_enum" enumName="ChargingStationNetworkEnum"
                    title="network" val="{{chargingStation.network}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateChargingStationObservable.bind(this)"
                    [object]="chargingStation" inpType="select_enum" title="category"
                    enumName="ChargingStationCategoryEnum" val="{{chargingStation.category}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateChargingStationObservable.bind(this)"
                    [object]="chargingStation" inpType="text" title="Charger Quantity"
                    val="{{chargingStation.chargerQuantity}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateChargingStationObservable.bind(this)"
                    [object]="chargingStation" inpType="select_enum" enumName="ParkingTypeEnum" title="Parking Type"
                    val="{{chargingStation.parkingType}}"></app-display-cell>

                  <app-display-cell [updateObservable]="updateChargingStationObservable.bind(this)"
                    [object]="chargingStation" inpType="select_enum" enumName="ChargingStationStatusEnum" title="status"
                    val="{{chargingStation.status}}"></app-display-cell>
                </div>

              </div>

              <!-- Address Information -->
              <div class="form-section">
                <h3 class="section-title">Address</h3>
                <app-display-cell [updateObservable]="updateChargingStationObservable.bind(this)"
                  [object]="chargingStation" inpType="text" title="address"
                  [val]="chargingStation.address"></app-display-cell>



                <app-display-cell [updateObservable]="updateChargingStationObservable.bind(this)"
                  [object]="chargingStation" inpType="text" title="city"
                  val="{{chargingStation.city}}"></app-display-cell>
              </div>




            </div>
          </div>
        </div>
      </div>

      <!-- Charge Points Tab -->
      <div *ngIf="tabsEnum === 'ChargePointsTab'" class="charging-stations-tab">
        <div class="card">
          <div class="card-content">
            <ng-container *ngIf="chargingStation.id != null && chargingStation.id != undefined">
              <app-charging-station-charge-points
                [chargingStationID]="chargingStation.id"></app-charging-station-charge-points>
            </ng-container>
          </div>
        </div>
      </div>

      <!-- Charging Station Images -->
      <div *ngIf="tabsEnum === 'ImagesTab'" class="images-tab">
        <app-charging-station-images [chargingStationID]="chargingStation.id"></app-charging-station-images>
      </div>
    </div>
  </div>
</app-dashboard-details-container>
