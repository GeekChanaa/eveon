<div class="page__inner">
  <div class="page__container">
    <div class="page__title h3">Settings</div>
    <div class="settings">
      <div class="settings__menu">
        <button (click)="changeTab('InformationsTab')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'InformationsTab'}">Informations</button>
        <button (click)="changeTab('ChargePointsTab')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'ChargePointsTab'}">Charge Points</button>
      </div>
      <div class="settings__wrapper">
        <select class="select">
          <option (click)="changeTab('InformationsTab')">Informations</option>
          <option (click)="changeTab('ChargePointsTab')">Charge Points</option>
        </select>
        <div class="settings__list">
          <div class="settings__item" *ngIf="tabsEnum == 'InformationsTab'">
            <div class="settings__anchor" id="basics" data-value="Basics"></div>
            <div class="title-green settings__title">Informations</div>
            <div class="settings__profile">

            </div>
            <div class="settings__fieldset">
              <app-display-cell title="name" val="{{chargingStation.name}}"></app-display-cell>
              <app-display-cell title="address" val="{{chargingStation.address}}"></app-display-cell>
              <app-display-cell title="network" val="{{chargingStation.network}}"></app-display-cell>
              <app-display-cell title="category" val="{{chargingStation.category}}"></app-display-cell>
              <app-display-cell title="chargerQuantity" val="{{chargingStation.chargerQuantity}}"></app-display-cell>
              <app-display-cell title="country" val="{{chargingStation.country}}"></app-display-cell>
              <app-display-cell title="state" val="{{chargingStation.state}}"></app-display-cell>
              <app-display-cell title="city" val="{{chargingStation.city}}"></app-display-cell>
              <app-display-cell title="latitude" val="{{chargingStation.latitude}}"></app-display-cell>
              <app-display-cell title="longitude" val="{{chargingStation.longitude}}"></app-display-cell>
              <app-display-cell title="organisation" val="{{chargingStation.organisation}}"></app-display-cell>
              <app-display-cell title="parkingType" val="{{chargingStation.parkingType}}"></app-display-cell>
              <app-display-cell title="status" val="{{chargingStation.status}}"></app-display-cell>
            </div>
          </div>
          <div class="settings__item" *ngIf="tabsEnum == 'ChargePointsTab'">
            <div class="settings__anchor" id="account" data-value="Account"></div>
            <div class="title-purple settings__title">Charge Points</div>
            <div class="settings__fieldset">
              <ng-container *ngIf="chargingStation.chargePoints.length > 0 && !cpfShow">
                <div *ngFor="let chargePoint of chargingStation.chargePoints">
                  <app-charging-station-charge-point [chargePoint]="chargePoint"></app-charging-station-charge-point>
                </div>
              </ng-container>

              <ng-container *ngIf="(chargingStation.chargePoints.length <= 0 && !cpfShow)">
                <div class="empty__card">
                  <div>
                    <img src="/assets/img/content/login-pic.png" alt="">
                  </div>
                  <div>
                    <button (click)="showChargePointForm()" class="button-stroke">Add Charge Point</button>
                  </div>
                </div>
              </ng-container>
              <ng-container *ngIf="cpfShow">
                <form [formGroup]="chargePointForm">
                  <app-form-field class="field" title="name" description="tbd" [control]="getControl('name')"></app-form-field>
                  <app-form-field class="field" title="serialNumber" description="tbd" [control]="getControl('serialNumber')"></app-form-field>
                  <app-form-field class="field" title="make" description="tbd" [control]="getControl('make')"></app-form-field>
                  <app-form-field class="field" title="status" description="tbd" [control]="getControl('status')"></app-form-field>
                  <app-form-field class="field" title="comment" description="tbd" [control]="getControl('comment')"></app-form-field>
                  <div class="field">
                    <div class="field__label">Category
                      <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                        <svg class="icon icon-info">
                          <use xlink:href="#icon-info"></use>
                        </svg>
                      </div>
                    </div>
                    <div class="field__wrap">
                      <div class="field__wrap">
                        <select class="select" formControlName="chargePointCategory">
                          <option value="The Tower">The Tower</option>
                          <option value="The Tower Plus">The Tower plus</option>
                          <option value="VX Commercial">VX Commercial</option>
                          <option value="The Tower DC">The Tower DC</option>
                          <option value="VX Home">VX Home</option>
                        </select>
                      </div>
                    </div>
                  </div>
                  <button (click)="cpfOnSubmit()" class="button">Create</button>
                </form>
              </ng-container>


            </div>

          </div>

        </div>
      </div>
    </div>
  </div>
</div>
