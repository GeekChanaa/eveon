<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="charging station"
      names="charging stations"
      [searchByAttributes]="['Name','Address','City','Organisation']"
      routeName="charging-stations"
      createLink="/dashboard/charging-stations/create"
      [fields]="fields" 
      [filterDefs]="filterDefs"
      [getItemsObservable]="getChargingStationsObservable.bind(this)"
      [deleteItemObservable]="deleteChargingStationObservable.bind(this)"
      [updateItemObservable]="updateChargingStationObservable.bind(this)"
      searchByPlaceHolder="Search by name, address, city or organisation"
      [breadcrumbs]="[
        { label: 'Dashboard', link: '/dashboard' },
        { label: 'Charging Stations'}
      ]"
      >
    </app-table-list>
  </div>
</div>
