<div class="card__head">
    <div class="title-green card__title">Recharge Cards</div>
</div>



<ng-container *ngIf="rechargeCards.length > 0">
    <app-recharge-card class="recharge_card" *ngFor="let rechargeCard of rechargeCards" [card]="rechargeCard"></app-recharge-card>
</ng-container>


<ng-container *ngIf="rechargeCards.length<=0">
    <app-empty-card></app-empty-card>
</ng-container>
