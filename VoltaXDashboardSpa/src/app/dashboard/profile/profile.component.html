<div class="page__inner">
  <div class="page__container">
    <div class="page__title h3">Settings</div>
    <div class="settings">
      <div class="settings__menu">
        <button (click)="changeTab('AccountInformationsTab')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'AccountInformationsTab'}">Account Informations</button>
        <button (click)="changeTab('SecurityTab')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'SecurityTab'}">Security</button>
        <button (click)="changeTab('RechargeCardsTab')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'RechargeCardsTab'}">Recharge Cards</button>
        <button (click)="changeTab('PaymentCardsTab')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'PaymentCardsTab'}">Payment Cards</button>
          <button (click)="changeTab('NotificationSettingsTab')" class="settings__link"
          [ngClass]="{'active' : tabsEnum == 'NotificationSettingsTab'}">Notification Settings</button>
      </div>
      <div class="settings__wrapper">
        <select class="select">
          <option (click)="changeTab('AccountInformationsTab')">Account Informations</option>
          <option (click)="changeTab('SecurityTab')">Security</option>
          <option (click)="changeTab('RechargeCardsTab')">Recharge Cards</option>
          <option (click)="changeTab('PaymentCardsTab')">Payment Cards</option>
        </select>
        <div class="settings__list">
          <div class="settings__item" *ngIf="tabsEnum == 'AccountInformationsTab'">
            <div class="settings__anchor" id="basics" data-value="Basics"></div>
            <div class="title-green settings__title">Profile Informations</div>
            <div class="settings__profile">
              
              <div class="settings__avatar" (click)="openChangeAvatarModal()">
                <img *ngIf="user.imageUrl == null" src="assets/images/avatar.jpg" alt="Avatar">
                <img *ngIf="user.imageUrl != null" [src]="staticUrl+user.imageUrl" alt="">
                <button class="settings__avatar-upload">
                  <svg class="icon icon-edit">
                    <use xlink:href="#icon-edit"></use>
                  </svg>
                </button>
              </div>

              <ng-container *ngIf="isChangeAvatarModalOpen">
                <div class="avatar__modal_overlay" (click)="closeModal()"></div>
                <div class="avatar__modal">
                  <div class="close-button-container">
                    <button class="close-button" (click)="closeModal()">
                      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M5.29289 5.29289C5.68342 4.90237 6.31658 4.90237 6.70711 5.29289L12 10.5858L17.2929 5.29289C17.6834 4.90237 18.3166 4.90237 18.7071 5.29289C19.0976 5.68342 19.0976 6.31658 18.7071 6.70711L13.4142 12L18.7071 17.2929C19.0976 17.6834 19.0976 18.3166 18.7071 18.7071C18.3166 19.0976 17.6834 19.0976 17.2929 18.7071L12 13.4142L6.70711 18.7071C6.31658 19.0976 5.68342 19.0976 5.29289 18.7071C4.90237 18.3166 4.90237 17.6834 5.29289 17.2929L10.5858 12L5.29289 6.70711C4.90237 6.31658 4.90237 5.68342 5.29289 5.29289Z"/></svg>
                    </button>
                  </div>
                  <div class="create__card card">
                    <div class="file">
                      <div class="file__label">User Avatar
                        <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed"
                          data-position="right">
                          <svg class="icon icon-info">
                            <use xlink:href="#icon-info"></use>
                          </svg>
                        </div>
                      </div>
                      <div class="file__wrap">
                        <input class="upload-input" type="file" (change)="handleUpload($event)" />
                        <div class="file__box" *ngIf="!displayedImage">
                          <svg class="icon icon-upload">
                            <use xlink:href="#icon-upload"></use>
                          </svg>Click or drop image
                        </div>
                        <div class="files__box">
                          <div *ngIf="displayedImage != null" class="image__box">
                            <div class="image__clear" (click)="clearImage()">X</div>
                            <img [src]="displayedImage" alt="">
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="form__actions">
                    <button class="button-small button" (click)="changeAvatar()"> Upload </button>
                  </div>
                </div>
              </ng-container>
            </div>
            <div class="settings__fieldset" *ngIf="user.id != null && user.id != 0">
              <app-display-cell 
                inpType="text" 
                title="firstName" 
                [updateObservable]="updateUserObservable.bind(this)"
                [val]="user.firstName"
                [object]="user"></app-display-cell>

              <app-display-cell 
                inpType="text" 
                title="lastName" 
                [updateObservable]="updateUserObservable.bind(this)"
                [val]="user.lastName"
                [object]="user"></app-display-cell>
                
              
              <div class="field">
                <div class="field__label">Email
                  <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                    <svg class="icon icon-info">
                      <use xlink:href="#icon-info"></use>
                    </svg>
                  </div>
                  <div class="field__edit" (click)="editingEmail = true">
                    <svg class="icon icon-edit">
                      <use xlink:href="#icon-edit"></use>
                    </svg>
                  </div>
                </div>
                <div class="field__information" *ngIf="!editingEmail">
                  {{user.email | titlecase}}
                </div>
                <div class="field__wrap" *ngIf="editingEmail">
                  <input class="field__input" type="email" name="email">
                </div>
              </div>
              <div class="field">
                <div class="field__label">Phone
                  <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                    <svg class="icon icon-info">
                      <use xlink:href="#icon-info"></use>
                    </svg>
                  </div>
                  <div class="field__edit" (click)="editingPhone = true">
                    <svg class="icon icon-edit">
                      <use xlink:href="#icon-edit"></use>
                    </svg>
                  </div>
                </div>
                <div class="field__information" *ngIf="!editingPhone">
                  {{user.phone | titlecase}}
                </div>
                <div class="field__wrap" *ngIf="editingPhone">
                  <input class="field__input" type="text" name="location">
                </div>
              </div>
            </div>
          </div>
          <div class="settings__item" *ngIf="tabsEnum == 'SecurityTab'">
            <app-profile-security [userID]="user.id"></app-profile-security>
          </div>
          <div class="settings__item" *ngIf="tabsEnum == 'RechargeCardsTab'">
            <app-recharge-cards [userID]="user.id"></app-recharge-cards>
          </div>
          <div class="settings__item" *ngIf="tabsEnum == 'PaymentCardsTab'">
            <app-debit-cards [userID]="user.id"></app-debit-cards>
          </div>
          <div class="settings__item" *ngIf="tabsEnum == 'NotificationSettingsTab'">
            <app-notification-settings></app-notification-settings>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
