
<div class="page__inner">
  <div class="page__container">
    <div class="page__title h3">Icons</div>
  
    <div class="icons-container">
      <div class="icon-container" *ngFor="let icon of iconList" (click)="copy(icon)">
        <div class="icon">
          <svg class="icon {{icon}}">
            <use [attr.xlink:href]="'#'+icon"></use>
          </svg>
        </div>
        <div class="icon__label">
          {{icon}}
        </div>
      </div>
    </div>
  </div>
</div>
