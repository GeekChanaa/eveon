<div class="page__inner">
  <div class="page__container">
    <div class="page__title h3">Component {{variable.name}} </div>

    
    <div class="card">
      <div class="title-purple card__title">
         Description
      </div>

      <div class="component__description">
        {{variable.description}}
      </div>
      
      <div class="title-purple card__title">
        Components Associated to the Variable : {{variable.name}}
      </div>
      <div class="stats">
        <div class="stats__table">
          <div class="stats__row">
            <div class="stats__col">Variable</div>
            <div class="stats__col">Data Type</div>
            <div class="stats__col">Unit</div>
          </div>
          <div class="stats__row" *ngFor="let component of variable.associatedComponents">
            <div class="stats__col component__name" [routerLink]="['/dashboard/documentation/components/'+component.component]">{{component.component}}</div>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</div>
