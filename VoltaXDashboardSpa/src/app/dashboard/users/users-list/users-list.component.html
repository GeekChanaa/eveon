<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="user"
      names="users"
      [searchByAttributes]="['FirstName','LastName','Email','Phone']"
      routeName="users"
      createLink="/dashboard/users/create"
      [fields]="fields" 
      [filterDefs]="filterDefs"
      [getItemsObservable]="getUsersObservable.bind(this)"
      [deleteItemObservable]="deleteUserObservable.bind(this)"
      [updateItemObservable]="updateUserObservable.bind(this)"
      searchByPlaceHolder="Search by name, email or phone"
      [breadcrumbs]="[
          { label: 'Dashboard', link: '/dashboard' },
          { label: 'Users'}
        ]"
      >
    </app-table-list>
  </div>
</div>
