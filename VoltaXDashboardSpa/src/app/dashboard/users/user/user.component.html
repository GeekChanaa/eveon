<app-dashboard-details-container 
  [state]="state"
  [title]="user?.fullName || 'User Details'" [breadcrumbs]="[
    { label: 'Dashboard', link: '/dashboard' },
    { label: 'Users', link: '/dashboard/users' },
    { label: user?.fullName || 'Details' }
  ]">

  <!-- Loading state -->
  <div *ngIf="!userLoaded" class="loading-container">
    <app-svg-spinner></app-svg-spinner>
  </div>

  <!-- Content area -->
  <div *ngIf="userLoaded" class="content-area">
    <!-- Tabs navigation -->
    <div class="tabs-container">
      <div class="tabs">
        <button [ngClass]="{'active': tabsEnum === 'InformationsTab'}" (click)="changeTab('InformationsTab')"
          class="tab-button">
          Informations
        </button>
        <button [ngClass]="{'active': tabsEnum === 'RechargeCardsTab'}" (click)="changeTab('RechargeCardsTab')"
          class="tab-button">
          Recharge Cards
        </button>

        <button [ngClass]="{'active': tabsEnum === 'ChargingSessionsTab'}" (click)="changeTab('ChargingSessionsTab')"
          class="tab-button">
          Charging Sessions
        </button>
        <button [ngClass]="{'active': tabsEnum === 'OrdersTab'}" (click)="changeTab('OrdersTab')" class="tab-button">
          Orders
        </button>
        <button [ngClass]="{'active': tabsEnum === 'ActionsTab'}" (click)="changeTab('ActionsTab')" class="tab-button">
          Actions
        </button>
      </div>
    </div>

    <!-- Tab content -->
    <div class="tab-content">
      <!-- Information Tab -->
      <div *ngIf="tabsEnum === 'InformationsTab'" class="information-tab">
        <div class="card profile-section">
          <div class="card-content">

            <!-- Main details -->
            <div class="form-content">
              <!-- Basic Information -->
              <div class="form-section">
                <h3 class="section-title">Basic Information</h3>

                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" [object]="user" inpType="text"
                  title="firstName" [val]="user.firstName"></app-display-cell>

                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" [object]="user" inpType="text"
                  title="lastName" [val]="user.lastName"></app-display-cell>


              </div>

              <!-- Contact Information -->
              <div class="form-section">
                <h3 class="section-title">Contact Information</h3>
                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" [object]="user" inpType="text"
                  title="email" [val]="user.email"></app-display-cell>

                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" inpType="checkbox" [object]="user"
                  title="isEmailVerified" [val]="user.isEmailVerified"></app-display-cell>

                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" [object]="user" inpType="text"
                  title="phone" [val]="user.phone"></app-display-cell>

                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" inpType="checkbox" [object]="user"
                  title="isPhoneNumberVerified" [val]="user.isPhoneNumberVerified"></app-display-cell>
              </div>

              <!-- Address Information -->
              <div class="form-section">
                <h3 class="section-title">Business Informations</h3>
                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" [object]="user"
                  inpType="select" title="roleID" [options]="rolesOptions" val="{{user.role}}"></app-display-cell>

                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" [object]="user"
                  inpType="select" title="partnerID" [options]="partnersOptions" val="{{user.partner}}"></app-display-cell>
                  
                <!-- Suspending Account -->
                <app-display-cell
                  [updateObservable]="updateUserObservable.bind(this)"
                  [object]="user"
                  inpType="date"
                  title="suspendedAt"
                  [val]="user.suspendedAt"
                  placeholder="Select suspension end date">
                </app-display-cell>

              </div>

              <!-- Additional Information -->
              <div class="form-section">
                <h3 class="section-title">Additional Informations</h3>

                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" [object]="user" inpType="date"
                  title="birthday" [val]="user.birthday"></app-display-cell>

                <app-display-cell [updateObservable]="updateUserObservable.bind(this)" [object]="user"
                  inpType="select" title="electricVehicleModelID" [options]="evModels" val="{{user.evModel ?? 'Not Specified'}}"></app-display-cell>

              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- Recharge Cards Tab -->
      <div *ngIf="tabsEnum === 'RechargeCardsTab'" class="information-tab">
        <app-user-recharge-cards [userID]="user.id"></app-user-recharge-cards>
      </div>

      <!-- Charging Serssions Tab -->
      <div *ngIf="tabsEnum === 'ChargingSessionsTab'" class="information-tab">
        <app-user-charging-sessions [userID]="user.id"></app-user-charging-sessions>
      </div>

      <!-- Orders Tab -->
      <div *ngIf="tabsEnum === 'OrdersTab'" class="information-tab">
          <app-user-orders [userID]="user.id"></app-user-orders>
      </div>

      <!-- Actions Tab -->
      <div *ngIf="tabsEnum === 'ActionsTab'" class="information-tab">
          <app-user-actions [userEmail]="user.email" [userID]="user.id"></app-user-actions>
      </div>
    </div>
  </div>
</app-dashboard-details-container>
