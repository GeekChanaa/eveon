<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="comment"
      names="comments"
      [searchByAttributes]="['Text','User.FirstName','User.LastName','ChargingStation.Name']"
      routeName="comments"
      createLink="/dashboard/comments/create"
      [fields]="fields" 
      [filterDefs]="filterDefs"
      [getItemsObservable]="getCommentsObservable.bind(this)"
      [deleteItemObservable]="deleteCommentObservable.bind(this)"
      [updateItemObservable]="updateCommentObservable.bind(this)"
      searchByPlaceHolder="Search by text, author or station"
      >
    </app-table-list>
  </div>
</div>
