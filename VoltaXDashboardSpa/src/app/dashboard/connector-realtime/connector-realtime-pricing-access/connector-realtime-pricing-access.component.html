<section class="pricing-access">
  <div class="section-intro">
    <div><h2>Pricing & access</h2><p>Set the public charging prices for each connector.</p></div>
    <button type="button" class="secondary-action reset-all" appConfirmAction [confirmTitle]="'Reset pricing'" [confirmMessage]="'Reset pricing for every connector to its default values?'" [confirmCallback]="resetPricingAllConnectors.bind(this)">Reset all pricing</button>
  </div>

  <app-preloader-container *ngIf="isLoading"></app-preloader-container>
  <app-empty-card *ngIf="!isLoading && (!connectors || !connectors.length)" [action]="'/dashboard/charging-points/' + ChargePoint.id" [actionName]="'Add Connectors'"></app-empty-card>

  <section class="connector-card" *ngFor="let connector of connectors; let i = index">
    <header>
      <div class="connector-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3v5m8-5v5M6 8h12v4a6 6 0 0 1-12 0V8Zm6 10v4"/></svg></div>
      <div><h3>Connector {{ connector.name || i + 1 }}</h3><p>Update charging prices and session fees.</p></div>
    </header>

    <form class="pricing-form" [formGroup]="getConnectorFormGroup(i)" (ngSubmit)="updateConnectorPricing(i)">
      <div class="price-fields">
        <label><span>Price per kWh</span><div class="currency-input"><input id="price-kwh-{{ connector.id }}" formControlName="pricePerKwh" type="number" min="0" step="0.01" inputmode="decimal"><span>per kWh</span></div></label>
        <label><span>Idle fee</span><div class="currency-input"><input id="idle-fee-{{ connector.id }}" formControlName="pricePerIdleMinute" type="number" min="0" step="0.01" inputmode="decimal"><span>per min</span></div></label>
        <label><span>Cost per kWh</span><div class="currency-input"><input id="cost-kwh-{{ connector.id }}" formControlName="costPerKwh" type="number" min="0" step="0.01" inputmode="decimal"><span>per kWh</span></div></label>
      </div>
      <div class="form-actions"><button type="submit" class="primary-action" [disabled]="isLoadingUpdate[connector.id] || !isConnectorFormGroupDirty(i)">{{ isLoadingUpdate[connector.id] ? 'Saving...' : 'Save pricing' }}</button></div>
    </form>

    <div class="flat-fee-section">
      <div><h4>Flat fee</h4><p>A fixed amount charged at the start of a session.</p></div>
      <form [formGroup]="getFlatFeeConnectorFormGroup(i)" (ngSubmit)="updateConnectorFlatFee(i)">
        <label class="flat-fee-input"><span class="sr-only">Flat fee</span><div class="currency-input"><input id="flat-fee-{{ connector.id }}" formControlName="flatFee" type="number" min="0" step="0.01" inputmode="decimal"><span>per session</span></div></label>
        <button type="submit" class="primary-action" [disabled]="isLoadingFFUpdate[connector.id] || !isFlatFeeFormGroupDirty(i)">{{ isLoadingFFUpdate[connector.id] ? 'Saving...' : 'Save fee' }}</button>
      </form>
      <button type="button" class="text-action" appConfirmAction [confirmTitle]="'Reset connector pricing'" [confirmMessage]="'Reset this connector pricing to its default values?'" [confirmCallback]="resetConnectorPricing.bind(this)" [confirmArgs]="[connector.id]">Reset this connector</button>
    </div>
  </section>
</section>
