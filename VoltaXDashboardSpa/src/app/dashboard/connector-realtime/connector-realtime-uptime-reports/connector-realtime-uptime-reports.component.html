<div class="title-purple card__title">
  <div class="title">Uptime Reports</div>
  <div class="connector__dropdown">
    <select class="select select_small" value="chargePoint" [(ngModel)]="report" (ngModelChange)="changedReport($event)">
      <option value="chargePoint">Charge Point</option>
      <option value="{{connector.id}}" *ngFor="let connector of connectors">connector : {{connector.connectorID}} </option>
    </select>
  </div>
</div>

<div class="stats" *ngIf="uptimeLogs != null && uptimeLogs.length > 0 && !isLoading">
  <div class="stats__table">
    <div class="stats__row">
      <div class="stats__col">Start</div>
      <div class="stats__col">End</div>
      <div class="stats__col">Status</div>
    </div>
    <div class="stats__row" *ngFor="let item of uptimeLogs">
      <div class="stats__col">{{item.startDate | date:'medium'}}</div>
      <div class="stats__col">{{item.endDate | date:'medium'}}</div>
      <div class="stats__col" *ngIf="item.chargePointUptimeStatus != '' || item.chargePointUptimeStatus != null">
          <app-connector-status-tag [connectorStatus]="item.chargePointUptimeStatus"></app-connector-status-tag>
      </div>
      <div class="stats__col" *ngIf="item.connectorUptimeStatus != '' || item.connectorUptimeStatus != null">
          <app-connector-status-tag [connectorStatus]="item.connectorUptimeStatus"></app-connector-status-tag>
      </div>
    </div>
    
  </div>
  <div class="pagination__container">
    <!-- <app-pagination
      [pagination]="pagination"
      (refreshEvent)="changedReport($event)"
      ></app-pagination> -->
  </div>
</div>

<app-empty-card *ngIf="uptimeLogs == null || uptimeLogs.length <= 0"></app-empty-card>

<div class="separator"></div>
