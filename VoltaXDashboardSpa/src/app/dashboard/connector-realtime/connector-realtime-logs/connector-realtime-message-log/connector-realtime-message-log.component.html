<div class="message__header">
  <div>
    <span class="message__eyebrow">Message log</span>
    <h3 class="message__title">{{messageLog.message}}</h3>
  </div>
  <button type="button" class="message__close" (click)="close()" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</div>

<div class="message__body">
  <dl class="message__details">
    <div class="message__detail">
      <dt>Connector ID</dt>
      <dd>{{messageLog.connectorId ?? '—'}}</dd>
    </div>
    <div class="message__detail">
      <dt>Time</dt>
      <dd>{{messageLog.logTime | date:'medium'}}</dd>
    </div>
    <div class="message__detail message__detail_wide">
      <dt>Result</dt>
      <dd>{{messageLog.result || '—'}}</dd>
    </div>
    <div class="message__detail message__detail_wide message__detail_error" *ngIf="messageLog.errorCode">
      <dt>Error code</dt>
      <dd>{{messageLog.errorCode}}</dd>
    </div>
  </dl>

  <section class="message__payload">
    <h4 class="message__payload-title">
      <span class="direction direction_in">IN</span>
      Request from charger
    </h4>
    <pre class="message__code" *ngIf="highlightedSentContent; else noPayload"><code class="language-json" [innerHTML]="highlightedSentContent"></code></pre>
  </section>

  <section class="message__payload">
    <h4 class="message__payload-title">
      <span class="direction direction_out">OUT</span>
      Response from server
    </h4>
    <pre class="message__code" *ngIf="highlightedReceivedContent; else noPayload"><code class="language-json" [innerHTML]="highlightedReceivedContent"></code></pre>
  </section>
</div>

<ng-template #noPayload>
  <div class="message__empty">No payload recorded</div>
</ng-template>
