<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="charge point"
      names="charge points"
      [searchByAttributes]="['ChargePointId','SerialNumber']"
      routeName="charging-points"
      createLink="/dashboard/charging-points/create"
      [breadcrumbs]="[
        { label: 'Dashboard', link: '/dashboard' },
        { label: 'Connector Real-time' }
      ]"
      [fields]="fields" 
      [filterDefs]="filterDefs"
      [deletable]="false"
      [getItemsObservable]="getChargePointsObservable.bind(this)"
      [updateItemObservable]="updateChargePointObservable.bind(this)"
      searchByPlaceHolder="Search by charge point ID or serial number"
      >
      <ng-template appTableCustomButton let-item>
        <button class="table__action connector__btn" routerLink="/dashboard/connector-realtime/{{item.id}}"> 
          <svg class="icon icon-charging-station">
              <use xlink:href="#icon-charging-station"></use>
          </svg>  
        </button>
      </ng-template>

      
    </app-table-list>
  </div>
</div>
