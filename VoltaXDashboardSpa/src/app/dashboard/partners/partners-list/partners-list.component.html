<div class="page__inner">
    <div class="page__container">
      <app-table-list 
        name="partner"
        names="partners"
        [searchByAttributes]="['Name','PartnerIdentificationNumber','Email','Phone','City']"
        routeName="partners"
        createLink="/dashboard/partners/create"
        [fields]="fields" 
        [filterDefs]="filterDefs"
        [getItemsObservable]="getPartnersObservable.bind(this)"
        [deleteItemObservable]="deletePartnerObservable.bind(this)"
        [updateItemObservable]="updatePartnerObservable.bind(this)"
        searchByPlaceHolder="Search by name, ID, email, phone or city"
        [breadcrumbs]="[
          { label: 'Dashboard', link: '/dashboard' },
          { label: 'Partners'}
        ]"
        >
      </app-table-list>
    </div>
  </div>
