<app-dashboard-form-container title="Add Partner Logo" [items]="[
    { label: 'Dashboard', link: '/dashboard' },
    { label: 'Partners', link: '/dashboard/partners' },
    { label: 'Create' }
  ]">
  <div form class="station-wizard people-logo">
    <header class="station-intro"><span class="station-eyebrow">Partner identity</span><h2>Add a partner logo</h2><p>Choose a logo to make this partner recognizable across the dashboard. You can also skip this step.</p></header>
    <div class="create__card card">
      <div class="file">
        <div class="file__wrap">
          <input aria-label="Choose partner logo" class="upload-input" type="file" (change)="handleUpload($event)" />
          <div class="file__box" *ngIf="!displayedLogo">
            <svg class="icon icon-upload">
              <use xlink:href="#icon-upload"></use>
            </svg>Choose a logo
          </div>
          <div class="files__box">
            <div *ngIf="displayedLogo != null" class="image__box">
              <button type="button" class="image__clear" aria-label="Remove selected logo" (click)="clearImage()">&times;</button>
              <img [src]="displayedLogo" alt="Selected partner logo">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="form__actions">
        <app-button 
          [outlined]="true"
          [variant]="'secondary'"
          (btnClick)="skip()">
        Skip</app-button>
        <app-button class="ml-auto" [variant]="'secondary'"
        (btnClick)="changeLogo()"
          type="submit">
          Save logo
        </app-button>
      </div>
  </div>

</app-dashboard-form-container>
