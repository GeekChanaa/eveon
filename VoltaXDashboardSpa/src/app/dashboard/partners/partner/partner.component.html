<app-dashboard-details-container [state]="state" [title]="partner?.name || 'Partner Details'" [breadcrumbs]="[
      { label: 'Dashboard', link: '/dashboard' },
      { label: 'Partners', link: '/dashboard/partners' },
      { label: partner?.name || 'Details' }
    ]">

  <!-- Loading state -->
  <div *ngIf="!partnerLoaded" class="loading-container">
    <app-svg-spinner></app-svg-spinner>
  </div>

  <!-- Content area -->
  <div *ngIf="partnerLoaded" class="content-area">
    <!-- Tabs navigation -->
    <div class="tabs-container">
      <div class="tabs">
        <button [ngClass]="{'active': tabsEnum === 'InformationsTab'}" (click)="changeTab('InformationsTab')"
          class="tab-button">
          Information
        </button>
        <button [ngClass]="{'active': tabsEnum === 'ChargingStationsTab'}" (click)="changeTab('ChargingStationsTab')"
          class="tab-button">
          Charging Stations
        </button>
      </div>
    </div>

    <!-- Tab content -->
    <div class="tab-content">
      <!-- Information Tab -->
      <div *ngIf="tabsEnum === 'InformationsTab'" class="information-tab">
        <div class="card profile-section">
          <div class="card-header">
            <h2>Partner Profile</h2>
          </div>
          <div class="card-content">
            <!-- Logo section -->
            <div class="logo-section">
              <div class="logo-container"
                *ngIf="!editingImage"
                [ngClass]="{'has-image': partner.logoUrl && !editingImage && !imageUploading}">
                <img *ngIf="partner.logoUrl && !editingImage && !imageUploading"
                  [src]="staticUrl + partner.logoUrl + '?t=' + timestamp" alt="Partner logo">

                <div *ngIf="!partner.logoUrl && !editingImage && !imageUploading" class="empty-logo"></div>

                <button *ngIf="!editingImage && !imageUploading" (click)="startEditing()" class="edit-logo-btn">
                  Change Logo
                </button>

                <div *ngIf="imageUploading" class="uploading-overlay">
                  <app-svg-spinner></app-svg-spinner>
                  <span>Uploading...</span>
                </div>
              </div>

              <!-- Logo upload -->
              <div *ngIf="editingImage" class="upload-container">
                <div class="dropzone"
                  [ngClass]="{'has-file': displayedLogo}"
                  [class.dragging]="isDragging"
                  (click)="fileInput.click()"
                  (dragover)="onDragOver($event)"
                  (dragleave)="onDragLeave($event)"
                  (drop)="onDrop($event)">

                <input #fileInput
                      type="file"
                      class="file-input"
                      accept="image/png, image/jpeg"
                      (change)="handleUpload($event)"
                      hidden>

                <div *ngIf="!displayedLogo" class="dropzone-prompt">
                  <i class="icon icon-upload"></i>
                  <p>Drag and drop an image or click to browse</p>
                </div>

                <div *ngIf="displayedLogo" class="preview-container">
                  <button class="remove-btn" (click)="clearImage()">
                    <i class="icon icon-trash"></i>
                  </button>
                  <img [src]="displayedLogo" alt="Logo preview">
                </div>
              </div>

                <div class="actions">
                  <button (click)="editingImage = false" class="btn btn-secondary">Cancel</button>
                  <button [disabled]="imageUploading || !displayedLogo" (click)="changeLogo()" class="btn btn-primary">
                    <span *ngIf="imageUploading">
                      <app-svg-spinner></app-svg-spinner> Uploading...
                    </span>
                    <span *ngIf="!imageUploading">Upload Image</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Main details -->
            <div class="form-content">
              <!-- Basic Information -->
              <div class="form-section">
                <h3 class="section-title">Basic Information</h3>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  inpType="text" title="Name" [val]="partner.name"></app-display-cell>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  [editable]="false" inpType="text" title="Partner Identification Number"
                  [val]="partner.partnerIdentificationNumber"></app-display-cell>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  inpType="textarea" title="Description" [val]="partner.description"></app-display-cell>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  inpType="select_enum" title="Type" enumName="PartnerTypeEnum"
                  val="{{partner.type}}"></app-display-cell>
              </div>

              <!-- Contact Information -->
              <div class="form-section">
                <h3 class="section-title">Contact Information</h3>

                <div class="field-group">
                  <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                    inpType="text" [control]="getControl('email')"  title="Email" [val]="partner.email"></app-display-cell>

                  <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                    inpType="text" title="email2" [control]="getControl('email2')" [val]="partner.email2"></app-display-cell>

                  <app-display-cell *ngIf="partner.email3" [updateObservable]="updatePartnerObservable.bind(this)"
                    [object]="partner" inpType="text" [control]="getControl('email3')" title="email3"
                    [val]="partner.email3"></app-display-cell>
                </div>

                <div class="field-group">
                  <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                    inpType="text" [control]="getControl('phone')" title="phone" [val]="partner.phone"></app-display-cell>

                  <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)"
                    [object]="partner" inpType="text" [control]="getControl('phone2')" title="phone2"
                    [val]="partner.phone2"></app-display-cell>

                  <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)"
                    [object]="partner" inpType="text" [control]="getControl('phone3')" title="phone3"
                    [val]="partner.phone3"></app-display-cell>
                </div>
              </div>

              <!-- Address Information -->
              <div class="form-section">
                <h3 class="section-title">Address</h3>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  inpType="text" title="Country" [val]="partner.country"></app-display-cell>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  inpType="text" title="City" [val]="partner.city"></app-display-cell>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  inpType="text" title="Address" [val]="partner.address"></app-display-cell>
              </div>

              <!-- Business Information -->
              <div class="form-section">
                <h3 class="section-title">Business Information</h3>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  inpType="text" title="Tax Identification Number"
                  [val]="partner.taxIdentificationNumber"></app-display-cell>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  inpType="text" title="Registration Number" [val]="partner.registrationNumber"></app-display-cell>

                <app-display-cell [updateObservable]="updatePartnerObservable.bind(this)" [object]="partner"
                  inpType="text" title="Bank Account Number" [val]="partner.bankAccountNumber"></app-display-cell>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Charging Stations Tab -->
      <div *ngIf="tabsEnum === 'ChargingStationsTab'" class="charging-stations-tab">
        <div class="card">
          <div class="card-header">
            <h2>Charging Stations</h2>
            <app-button variant="secondary" [routerLink]="['/dashboard/charging-stations/create']"
              [queryParams]="{ partnerId: partnerID }">
              Add Station
            </app-button>
          </div>
          <div class="card-content">
            <ng-container *ngIf="partner.id != null && partner.id != undefined">
              <app-partner-charging-stations [partnerID]="partner.id"></app-partner-charging-stations>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-dashboard-details-container>
