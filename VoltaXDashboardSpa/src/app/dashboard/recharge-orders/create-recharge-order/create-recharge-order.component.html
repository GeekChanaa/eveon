<app-dashboard-form-container title="New Recharge Order" [items]="[
    { label: 'Dashboard', link: '/dashboard' },
    { label: 'Orders', link: '/dashboard/orders' },
    { label: 'Create' }
  ]">
  <div form>
    <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
      <div class="create__card card charge_point_form">
        <div class="create__group create__group3">

          <app-form-field class="field" title="Order Status" inputType="select_enum" enumName="RechargeOrderStatus"
            description="The status of the order" [control]="getControl('status')"></app-form-field>
          

          <app-search-input class="field"
            placeholder="Card"
            title="Card"
            description="The Card to be affected by this order."
            [control]="getControl('cardID')"
            [options]="cards"></app-search-input>


          <app-form-field class="field" title="Amount" placeholder="Amount" description="Amount of the order"
            [control]="getControl('amount')" icon="icon-info"></app-form-field>

            
        </div>
      </div>
      <div class="form__actions">
        <app-button class="ml-auto" [disabled]="orderForm.invalid" [isLoading]="isLoading" [variant]="'secondary'"
          type="submit">
          Submit
        </app-button>
      </div>

    </form>
  </div>

</app-dashboard-form-container>
