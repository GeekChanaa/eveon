<app-dashboard-form-container title="New recharge order" [items]="[{ label: 'Dashboard', link: '/dashboard' }, { label: 'Recharge orders', link: '/dashboard/recharge-orders' }, { label: 'New order' }]">
  <div form class="recharge-order-create">
    <div class="station-intro"><h2>Mock payment</h2><p>Choose a card, amount, and payment outcome. Only completed payments credit the card balance.</p></div>
    <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" novalidate>
      <section class="order-section"><header><h3>Recharge details</h3><p>Select the target card and amount.</p></header><div class="order-fields">
        <label><span>Recharge card</span><select formControlName="cardID"><option value="">Select a card</option><option *ngFor="let card of cards" [value]="card.id">{{ card.name }}</option></select><small *ngIf="getControl('cardID').touched && getControl('cardID').invalid">Select a recharge card.</small></label>
        <label><span>Amount</span><div class="amount-input"><input formControlName="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00"><span>MAD</span></div><small *ngIf="getControl('amount').touched && getControl('amount').invalid">Enter an amount greater than zero.</small></label>
      </div></section>
      <section class="order-section"><header><h3>Mock payment outcome</h3><p>Every attempt gets a quote email; only Completed updates the balance.</p></header><div class="status-options"><label *ngFor="let status of paymentStatuses" [class.selected]="orderForm.value.status === status"><input type="radio" formControlName="status" [value]="status"><span>{{ status }}</span></label></div></section>
      <div class="form-actions"><button type="button" class="secondary-action" [routerLink]="['/dashboard/recharge-orders']">Cancel</button><button type="submit" class="primary-action" [disabled]="isLoading">{{ isLoading ? 'Processing...' : 'Create payment' }}</button></div>
    </form>
  </div>
</app-dashboard-form-container>
