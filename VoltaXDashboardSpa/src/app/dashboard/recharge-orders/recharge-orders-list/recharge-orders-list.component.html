<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="Order"
      names="Orders"
      [searchByAttributes]="['Card.CardNumber','ProviderReference','Note']"
      routeName="recharge-orders"
      createLink="/dashboard/recharge-orders/create"
      [fields]="fields" 
      [filterDefs]="filterDefs"
      [getItemsObservable]="getOrdersObservable.bind(this)"
      [deleteItemObservable]="deleteOrderObservable.bind(this)"
      [updateItemObservable]="updateOrderObservable.bind(this)"
      searchByPlaceHolder="Search by card number, payment reference or note"
      [breadcrumbs]="[
        { label: 'Dashboard', link: '/dashboard' },
        { label: 'Orders'}
      ]"
      >
    </app-table-list>
  </div>
</div>
