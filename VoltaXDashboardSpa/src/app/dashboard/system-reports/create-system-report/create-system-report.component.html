<app-dashboard-form-container title="New System Report" [items]="[
      { label: 'Dashboard', link: '/dashboard' },
      { label: 'System Reports', link: '/dashboard/system-reports' },
      { label: 'Create' }
    ]">
  <div form>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field__group">
          <app-progress-bar *ngIf="isLoading"></app-progress-bar>
          <ng-container *ngIf="isLoading">
            <app-preloader-container></app-preloader-container>
          </ng-container>

            <app-form-field class="field" title="Issue Description" inputType="text" 
              description="Description of the issue of the report."
              [control]="getControl('issueDescription')"></app-form-field>

            <app-form-field class="field" title="Criticality" inputType="select_enum" enumName="ReportCriticality"
              description="The type of parking available at this charging station (e.g., Street Parking, Garage, Lot)."
              [control]="getControl('criticality')"></app-form-field>


            <app-form-field class="field" title="Status" inputType="select_enum" enumName="ReportStatusEnum"
              description="The type of parking available at this charging station (e.g., Street Parking, Garage, Lot)."
              [control]="getControl('status')"></app-form-field>

            <app-form-field class="field" title="Status" inputType="select_enum" enumName="ReportCategory"
              description="The type of parking available at this charging station (e.g., Street Parking, Garage, Lot)."
              [control]="getControl('reportCategory')"></app-form-field>

            <app-form-field class="field" title="Send Email ?" inputType="toggle" 
              description="The type of parking available at this charging station (e.g., Street Parking, Garage, Lot)."
              [control]="getControl('isEmail')"></app-form-field>


            <app-form-field class="field" title="Send Notification ?" inputType="toggle" 
              description="The type of parking available at this charging station (e.g., Street Parking, Garage, Lot)."
              [control]="getControl('isNotification')"></app-form-field>

            

            <div class="field">
              <div class="field__label">ChargePoint
                <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                  <svg class="icon icon-info">
                    <use xlink:href="#icon-info"></use>
                  </svg>
                </div>
              </div>
              <div class="field__wrap">
                <div class="field__wrap">
                  <select class="select" formControlName="chargePointID">
                    <option [value]="null">None</option>
                    <option *ngFor="let chargePoint of chargePoints" value="{{chargePoint.id}}">{{chargePoint.name}}
                    </option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <div class="field__label">Connector
                <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                  <svg class="icon icon-info">
                    <use xlink:href="#icon-info"></use>
                  </svg>
                </div>
              </div>
              <div class="field__wrap">
                <div class="field__wrap">
                  <select class="select" formControlName="connectorID">
                    <option [value]="null">None</option>
                    <option *ngFor="let connector of connectors" value="{{connector.id}}">{{connector.name}}</option>
                  </select>
                </div>
              </div>
            </div>



            <div class="field">
              <div class="field__label">Assigned User
                <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                  <svg class="icon icon-info">
                    <use xlink:href="#icon-info"></use>
                  </svg>
                </div>
              </div>
              <div class="field__wrap">
                <div class="field__wrap">
                  <select class="select" formControlName="assignedID">
                    <option [value]="null">None</option>
                    <option *ngFor="let support of supports" value="{{support.id}}">{{support.fullName}}</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <div class="field__label">Concerned User
                <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                  <svg class="icon icon-info">
                    <use xlink:href="#icon-info"></use>
                  </svg>
                </div>
              </div>
              <div class="field__wrap">
                <div class="field__wrap">
                  <select class="select" formControlName="userID">
                    <option [value]="null">None</option>
                    <option *ngFor="let support of supports" value="{{support.id}}">{{support.fullName}}</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <div class="field__label">Card
                <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
                  <svg class="icon icon-info">
                    <use xlink:href="#icon-info"></use>
                  </svg>
                </div>
              </div>
              <div class="field__wrap">
                <div class="field__wrap">
                  <select class="select" formControlName="cardID">
                    <option [value]="null">None</option>
                    <option *ngFor="let card of cards" value="{{card.id}}">{{card.fullName}} {{card.cardNumber}}
                    </option>
                  </select>
                </div>
              </div>
            </div>

      </div>
      <div class="form__actions">
        <app-button class="ml-auto" [disabled]="form.invalid" [isLoading]="isLoading" [variant]="'secondary'"
          type="submit">
          Submit
        </app-button>
      </div>
    </form>
  </div>


</app-dashboard-form-container>
