<div class="page__inner">
  <div class="page__container">
    <app-table-list 
      name="system report"
      names="system reports"
      [searchByAttributes]="['IssueDescription','ChargePoint.ChargePointId']"
      routeName="system-reports"
      createLink="/dashboard/system-reports/create"
      [fields]="fields" 
      [filterDefs]="filterDefs"
      [getItemsObservable]="getSystemReportsObservable.bind(this)"
      [deleteItemObservable]="deleteSystemReportObservable.bind(this)"
      [updateItemObservable]="updateSystemReportObservable.bind(this)"
      [breadcrumbs]="[
        { label: 'Dashboard', link: '/dashboard' },
        { label: 'System Reports'}
      ]"
      searchByPlaceHolder="Search by description or charge point"
      >
    </app-table-list>
  </div>
</div>
