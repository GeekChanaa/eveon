<app-dashboard-details-container 
  [state]="state"
  [title]="systemReport?.name || 'System Report Details'" [breadcrumbs]="[
  { label: 'Dashboard', link: '/dashboard' },
  { label: 'System Reports', link: '/dashboard/system-reports' },
  { label: systemReport?.name || 'Details' }
]">

  <!-- Loading state -->
  <div *ngIf="!systemReportLoaded" class="loading-container">
    <app-svg-spinner></app-svg-spinner>
  </div>

  <!-- Content area -->
  <div *ngIf="systemReportLoaded" class="content-area">
    <!-- Tabs navigation -->
    <div class="tabs-container">
      <div class="tabs">
        <button [ngClass]="{'active': tabsEnum === 'InformationsTab'}" (click)="changeTab('InformationsTab')"
          class="tab-button">
          Information
        </button>
        <button [ngClass]="{'active': tabsEnum === 'CommentsTab'}" (click)="changeTab('CommentsTab')"
          class="tab-button">
          Comments
        </button>
      </div>
    </div>

    <!-- Tab content -->
    <div class="tab-content">
      <!-- Information Tab -->
      <div *ngIf="tabsEnum === 'InformationsTab'" class="information-tab">
        <div class="card profile-section">
          
          <div class="card-content">

            <!-- Main details -->
            <div class="form-content">
              
              <div class="form-section">
                <h3 class="section-title">Informations</h3>
                <div class="field-group">
                  <!-- <app-display-cell  
                    [object]="chargingStation"
                    [editable]="false"
                    title="Partner"
                    val="{{chargingStation.partnerName}}"></app-display-cell> -->
                </div>
                
              </div>
              

              

              
            </div>
          </div>
        </div>
      </div>

      <!-- Charging Stations Tab -->
      <div *ngIf="tabsEnum === 'CommentsTab'" class="charging-stations-tab">
        <div class="card">
          <div class="card-content">
            <ng-container *ngIf="systemReport.id != null && systemReport.id != undefined">
              <app-system-report-comments [systemReportID]="systemReport.id"></app-system-report-comments>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-dashboard-details-container>
