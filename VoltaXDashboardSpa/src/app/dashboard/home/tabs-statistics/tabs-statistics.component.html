<div class="metric-grid" role="tablist" aria-label="Performance metrics">
<button *ngFor="let metric of metrics; let i = index" type="button" class="metric" role="tab" [class.selected]="selected === metric" [id]="'metric-' + metric.key" [attr.aria-selected]="selected === metric" aria-controls="metric-chart" [attr.tabindex]="selected === metric ? 0 : -1" (click)="select(metric)" (keydown)="moveTab($event, i)">
  <span class="metric-label"><svg aria-hidden="true"><use [attr.href]="'#' + metric.icon"></use></svg>{{metric.label}}</span>
  <span class="metric-value">{{metric.loading ? '…' : metric.total === null ? '—' : (metric.total | number:'1.0-2')}} <small>{{metric.unit}}</small></span>
  <span class="metric-footer"><span>All time</span><span>Today <b>{{metric.loading ? '…' : metric.today === null ? '—' : (metric.today | number:'1.0-2')}}</b></span></span>
</button>
</div>
<div class="chart-panel" id="metric-chart" role="tabpanel" tabindex="0" [attr.aria-labelledby]="'metric-' + selected.key" [attr.aria-busy]="selected.loading">
  <div class="chart-heading"><div><h3>{{selected.label}}</h3><p>Daily activity · {{selected.unit}}</p></div><span class="period-label">Last 30 days</span></div>
  <div class="metric-notice" *ngIf="selected.error" role="status">Some figures could not be loaded.<button type="button" (click)="load(selected)" [disabled]="selected.loading">Try again</button></div>
  <div *ngIf="selected.loading" class="chart-message" role="status"><span class="loading-mark"></span>Loading {{selected.label.toLowerCase()}}…</div>
  <ng-container *ngIf="!selected.loading">
    <div *ngIf="!selected.chart || selected.chart.empty" class="chart-message">{{selected.chart ? 'No activity recorded for this period.' : 'Chart data is currently unavailable.'}}</div>
    <apx-chart *ngIf="selected.chart && !selected.chart.empty" [series]="selected.chart.series" [chart]="selected.chart.chart" [xaxis]="selected.chart.xaxis" [yaxis]="selected.chart.yaxis" [stroke]="selected.chart.stroke" [fill]="selected.chart.fill" [dataLabels]="selected.chart.dataLabels" [colors]="selected.chart.colors" [grid]="selected.chart.grid" [tooltip]="selected.chart.tooltip"></apx-chart>
  </ng-container>
</div>
