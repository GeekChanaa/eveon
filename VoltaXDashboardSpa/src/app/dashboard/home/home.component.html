<div class="overlay"></div>
<!-- inner-->
<div class="page__inner">
  <div class="page__container">
    <div class="page__title h3">
      Home
      <app-breadcrumb  class="breadcrumb" [items]="[{label : 'Home'}]"></app-breadcrumb>
    </div>

    <!-- Chargers Overview -->
    <div class="card">
      <div class="card__head">
        <div class="title-purple card__title">Charge Points Connectors Overview</div>
      </div>
      <div class="connector__status">
        <app-connector-statuses class="connector__status__list"></app-connector-statuses>
      </div>
    </div>

    <div class="card">
      <app-card title="overview">
        <app-tabs-statistics></app-tabs-statistics>
      </app-card>
    </div>

    <div class="card">
      <div class="card__head">
        <div class="title-purple card__title">Links</div>
      </div>
      <div class="connector__status">
        <div class="connector__status__list">
          <app-small-card 
            [number]="-1" 
            [icon]="'icon-charging-station'"
            routerLink="/dashboard/charging-stations" 
            class="connector__status__item" 
            title="Charging Stations" description="available"></app-small-card>

          <app-small-card [number]="-1" [icon]="'icon-type2-charger'" routerLink="/dashboard/charging-points" class="connector__status__item"
            title="Charge points" description="Unavailable"></app-small-card>
          <app-small-card [number]="-1" [icon]="'icon-charging-cable'" routerLink="/dashboard/connector-realtime" class="connector__status__item"
            title="Connector Real-time" description="Occupied"></app-small-card>
          <app-small-card [number]="-1" [icon]="'icon-payment'" routerLink="/dashboard/charging-cards" class="connector__status__item"
            title="Recharge Cards" description="Faulted"></app-small-card>
          <app-small-card [number]="-1" [icon]="'icon-profile-circle'" routerLink="/dashboard/users" class="connector__status__item" title="Users"
            description="Reserved"></app-small-card>
        </div> 
      </div>
      <div class="connector__status">
        <div class="connector__status__list">
          <app-small-card [number]="-1" [icon]="'icon-bar-chart'" routerLink="/dashboard/statistics" class="connector__status__item"
            title="Statistics" description="available"></app-small-card>
          <app-small-card [number]="-1" [icon]="'icon-basket'" routerLink="/dashboard/recharge-orders" class="connector__status__item"
            title="Orders" description="Unavailable"></app-small-card>
          <app-small-card [number]="-1" [icon]="'icon-arrows-up-down'" routerLink="/dashboard/transactions" class="connector__status__item"
            title="Transactions" description="Occupied"></app-small-card>
          <app-small-card [number]="-1" [icon]="'icon-warning'" routerLink="/dashboard/system-reports" class="connector__status__item"
            title="System Reports" description="Faulted"></app-small-card>
          <app-small-card [number]="-1" [icon]="'icon-warning'" routerLink="/dashboard/reports" class="connector__status__item"
            title="Reports" description="Reserved"></app-small-card>
        </div>
      </div>
    </div>
  </div>
</div>
