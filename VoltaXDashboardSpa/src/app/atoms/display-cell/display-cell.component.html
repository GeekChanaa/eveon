<div class="field">
  <div class="field__label">{{title | titlecase}}
    <div class="tooltip" title="Maximum 100 characters. No HTML or emoji allowed">
      <svg class="icon icon-info">
        <use xlink:href="#icon-info"></use>
      </svg>
    </div>
    <div class="field__edit" (click)="editing = true">
      <svg class="icon icon-edit">
        <use xlink:href="#icon-edit"></use>
      </svg>
    </div>
  </div>
  <div class="field__information" *ngIf="!editing">
    <ng-container *ngIf="inpType == 'text'">
      {{val | titlecase}}
    </ng-container>
    <ng-container *ngIf="inpType == 'select_enum'">
      {{enumMappings[val]}}
    </ng-container>
  </div>
  <div class="field__wrap flex" *ngIf="editing">

    <ng-container *ngIf="inpType == 'text'">
      <input [(ngModel)]="updatedValue" class="field__input" type="text" value="{{val}}">
    </ng-container>

    <ng-container *ngIf="inpType == 'select_enum'">
      <select class="select" [(ngModel)]="updatedValue">
        <option *ngFor="let key of getEnumKeys()" [value]="key">{{enumMappings[key]}}</option>
    </select>
    
    </ng-container>


    <button class="button-stroke inp-btn" (click)="update()" >
      <svg class="icon icon-check">
        <use xlink:href="#icon-check"></use>
      </svg>
    </button>
    <button class="button-stroke inp-btn" (click)="editing = false">
      <svg class="icon icon-close">
        <use xlink:href="#icon-close"></use>
      </svg>
    </button>
  </div>
</div>
