<!-- display-cell.component.html -->
<div class="form-field" [class.form-field--modern]="modern" [ngClass]="{
  'form-field--editing': editing,
  'form-field--read-only': !editable,
  'form-field--has-errors': hasErrors && !editing,
  'form-field--invalid': editing && hasErrors
}">
  <label class="form-field__label">
    {{ title | camelCaseToSpace }}

    <ng-container *ngIf="tooltip">
      <div class="form-field__tooltip" [title]="tooltip">
        <svg class="icon icon-info">
          <use xlink:href="#icon-info"></use>
        </svg>
      </div>
    </ng-container>

    <button *ngIf="editable && !editing"
            type="button" [attr.aria-label]="'Edit ' + title" class="form-field__edit-btn"
            (click)="startEditing()">
      <svg class="icon icon-edit">
        <use xlink:href="#icon-edit"></use>
      </svg><span *ngIf="modern">Edit</span>
    </button>
  </label>


  <!-- Display Mode -->
  <div class="form-field__display" *ngIf="!editing">
    <ng-container [ngSwitch]="inpType">
      <!-- Text Input -->
      <ng-container *ngSwitchCase="'text'">
        <a *ngIf="isLink" [routerLink]="link" class="form-field__link">
          {{ val | titlecase }}
        </a>
        <span *ngIf="!isLink" class="form-field__value">
          {{ val | titlecase }}
        </span>
      </ng-container>

      <!-- Number Input -->
      <ng-container *ngSwitchCase="'number'">
        <a *ngIf="isLink" [routerLink]="link" class="form-field__link">
          {{ val }}
        </a>
        <span *ngIf="!isLink" class="form-field__value">
          {{ val }}
        </span>
      </ng-container>

      <!-- Textarea Input -->
      <ng-container *ngSwitchCase="'textarea'">
        <div class="form-field__value form-field__value--multiline">
          {{ val }}
        </div>
      </ng-container>

      <!-- Enum Select -->
      <ng-container *ngSwitchCase="'select_enum'">
        <span class="form-field__value form-field__value--enum">
          {{ val | camelCaseToSpace }}
        </span>
      </ng-container>

      <!-- Date Input -->
      <ng-container *ngSwitchCase="'date'">
        <span class="form-field__value">
          {{ val | date:'mediumDate' }}
        </span>
      </ng-container>

      <ng-container *ngSwitchCase="'checkbox'">
        <div class="form-field__value form-field__value--checkbox">
          <div class="checkbox-display" [class.checkbox-display--checked]="val">
            <svg *ngIf="val" class="icon icon-check">
              <use xlink:href="#icon-check"></use>
            </svg>
          </div>
          <span class="checkbox-label">{{ val ? 'Yes' : 'No' }}</span>
        </div>
      </ng-container>

      <!-- Default case -->
      <ng-container *ngSwitchDefault>
        <span class="form-field__value">
          {{ val }}
        </span>
      </ng-container>
    </ng-container>

    <div *ngIf="val != 0 && !val && !editing && inpType != 'checkbox'" class="form-field__empty">
      Not specified
    </div>
  </div>


  <!-- Edit Mode -->
  <div class="form-field__edit" *ngIf="editing">
    <ng-container [ngSwitch]="inpType">
      <!-- Text Input -->
      <input *ngSwitchCase="'text'"
             #inputField
             type="text"
             class="form-field__input"
             [class.form-field__input--invalid]="hasErrors"
             [value]="updatedValue"
             (input)="onInputChange($event)"
             [placeholder]="'Enter ' + title"
             (keydown.escape)="cancelEditing()">

      <!-- Number Input -->
      <input *ngSwitchCase="'number'"
             #inputField
             type="number"
             class="form-field__input"
             [class.form-field__input--invalid]="hasErrors"
             [value]="updatedValue"
             (input)="onInputChange($event)"
             [placeholder]="'Enter ' + title"
             (keydown.escape)="cancelEditing()">

      <!-- Textarea Input -->
      <textarea *ngSwitchCase="'textarea'"
          #inputField
          class="form-field__textarea"
          [class.form-field__textarea--invalid]="hasErrors"
          [value]="updatedValue"
          (input)="onInputChange($event)"
          [placeholder]="'Enter ' + title"
          (keydown.escape)="cancelEditing()">
      </textarea>

      <div *ngSwitchCase="'checkbox'" class="form-field__checkbox-wrapper">
        <label class="form-field__checkbox-label">
          <input type="checkbox"
                 class="form-field__checkbox"
                 [checked]="updatedValue"
                 (change)="onCheckedChange($event)">
          <span class="checkbox-custom">
            <svg *ngIf="updatedValue" class="icon icon-check">
              <use xlink:href="#icon-check"></use>
            </svg>
          </span>
          <span>{{ updatedValue ? 'Yes' : 'No' }}</span>
        </label>
      </div>

      <!-- Enum Select -->
      <div *ngSwitchCase="'select_enum'" class="form-field__select-wrapper">
        <select class="form-field__select"
                [class.form-field__select--invalid]="hasErrors"
                [value]="updatedValue"
                (change)="onInputChange($event)">
          <option *ngFor="let value of getEnumValues()" [value]="value">
            {{ value.toString() | camelCaseToSpace }}
          </option>
        </select>
      </div>

      <!-- Select -->
       <div *ngSwitchCase="'select'" class="form-field__select-wrapper">
        <select class="form-field__select"
                [class.form-field__select--invalid]="hasErrors"
                [value]="updatedValue"
                (change)="onInputChange($event)">
          <option *ngFor="let option of options" [value]="option.value.toString()">
            {{ option.label.toString() | camelCaseToSpace }}
          </option>
        </select>
      </div>

      <!-- Date Input -->
      <input *ngSwitchCase="'date'"
             #inputField
             type="date"
             class="form-field__input"
             [class.form-field__input--invalid]="hasErrors"
             [value]="updatedValue"
             (input)="onInputChange($event)"
             (keydown.escape)="cancelEditing()">
    </ng-container>

    <!-- Validation Errors Display -->


    <div class="form-field__actions">
      <button type="button" class="form-field__btn form-field__btn--save"
              [disabled]="isLoading || hasErrors"
              (click)="updateVal()">
        <span *ngIf="modern">{{ isLoading ? 'Saving...' : 'Save' }}</span>
        <ng-container *ngIf="!isLoading && !modern">
          <svg class="icon icon-check">
            <use xlink:href="#icon-check"></use>
          </svg>
        </ng-container>
        <ng-container *ngIf="isLoading">
          <app-svg-spinner></app-svg-spinner>
        </ng-container>
      </button>

      <button type="button" aria-label="Cancel editing" class="form-field__btn form-field__btn--cancel"
              [disabled]="isLoading"
              (click)="cancelEditing()">
        <span *ngIf="modern">Cancel</span><svg *ngIf="!modern" class="icon icon-close">
          <use xlink:href="#icon-close"></use>
        </svg>
      </button>
    </div>

    <div *ngIf="hasErrors" class="form-field__validation-errors">
      <div *ngFor="let error of validationErrors" class="form-field__validation-error">
        {{ error }}
      </div>
    </div>
  </div>

  <!-- Error Message (for API errors or custom errors) -->
  <div *ngIf="errorMessage" class="form-field__error">
    {{ errorMessage }}
  </div>

  <!-- Display validation errors in read-only mode -->
  <div *ngIf="hasErrors && !editing" class="form-field__validation-errors">
    <div *ngFor="let error of validationErrors" class="form-field__validation-error">
      {{ error }}
    </div>
  </div>
</div>
