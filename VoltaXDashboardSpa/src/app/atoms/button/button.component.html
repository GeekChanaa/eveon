<button
  [type]="type"
  [disabled]="disabled"
  [attr.aria-label]="ariaLabel"
  [ngClass]="buttonClasses"
  (click)="onClick($event)"
  (focus)="onFocus($event)"
  (blur)="onBlur($event)"
  (keydown)="onKeyDown($event)"
  (keyup)="onKeyUp($event)"
  (mouseenter)="onMouseEnter($event)"
  (mouseleave)="onMouseLeave($event)">
  <ng-content></ng-content>
</button>
