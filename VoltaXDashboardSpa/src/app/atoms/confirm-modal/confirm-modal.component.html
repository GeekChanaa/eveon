<div class="modal-backdrop" *ngIf="isVisible" (click)="onBackdropClick($event)" (keydown.escape)="cancel()">
  <div class="modal" [class.modal--danger]="tone === 'danger'" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-message">
    <div class="modal__icon" aria-hidden="true">!</div>
    <h2 id="confirm-modal-title">{{ title }}</h2>
    <p id="confirm-modal-message">{{ message }}</p>
    <div class="modal__actions">
      <button class="modal__button modal__button--cancel" type="button" autofocus (click)="cancel()">Cancel</button>
      <button class="modal__button modal__button--confirm" type="button" (click)="confirm()">{{ confirmLabel }}</button>
    </div>
  </div>
</div>
