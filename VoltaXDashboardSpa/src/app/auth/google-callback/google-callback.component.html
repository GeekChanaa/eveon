<div class="icon">
  <img class="some-icon" src="/assets/images/logos/logo.svg" alt="eveon"><img class="some-icon-dark" src="/assets/images/logos/logo-white.svg" alt="eveon">
</div>
<div class="form-container" aria-live="polite">
  <ng-container *ngIf="errorMessage == ''">
    <div class="title" role="status">{{ 'auth.session.signingIn' | translate }}</div>
    <div class="subtitle">{{ 'auth.google.finishing' | translate }}</div>
  </ng-container>

  <ng-container *ngIf="errorMessage != ''">
    <div class="title">{{ 'auth.google.failed' | translate }}</div>
    <app-info-box [message]="errorMessage | translate" [type]="'error'" role="alert"></app-info-box>
    <app-button class="entry__button" [variant]="'secondary'" size="large" (btnClick)="backToLogin()">
      {{ 'auth.google.backToLogin' | translate }}
    </app-button>
  </ng-container>
</div>
