<div class="page page_simple">
  <div class="container">
      <a class="image__container">
        <img src="/assets/images/logos/partner-logo.png" alt="Partner">
      </a>
      <div class="form_title">Choose a new password</div>
      <form [formGroup]="form">
        <div class="entry__fieldset">
          <app-form-field
            class="field"
            title="Password"
            placeholder="New Password"
            description="New Password"
            [control]="getControl('password')"
            inputType="password"
            icon="icon-mail"
          ></app-form-field>

          <app-form-field
            class="field"
            title="Confirm Password"
            placeholder="Confirm Password"
            description="Password confirmation"
            [control]="getControl('confirmPassword')"
            inputType="password"
            icon="icon-mail"
          ></app-form-field>

          <app-info-box message="{{errorMessage}}" [type]="'error'" *ngIf="errorMessage"></app-info-box>

          <app-button variant="secondary"
            [isLoading]="isLoading"
            [disabled]="!form.valid"
            [ngClass]="{'disabled':!form.valid}"
            (click)="resetPassword()" class="entry__button">
            Reset Password
          </app-button>
        </div>
      </form>
  </div>
</div>
