<div class="icon">
  <img src="/assets/images/logos/partner-logo.png" alt="">
</div>
<div class="form-container" *ngIf="twoFactorToken">
  <form [formGroup]="twoFactorForm" (ngSubmit)="verifyTwoFactor()">
    <div class="entry__fieldset">
      <div class="entry__text">Enter the 6 digit code from your authenticator app, or one of your recovery codes.</div>
      <app-form-field
        class="field"
        title="Authentication code"
        placeholder="123456"
        description="Code from your authenticator app"
        [control]="getTwoFactorControl()"
        icon="icon-info"
      ></app-form-field>

      <app-info-box message="{{errorMessage}}" [type]="'error'" *ngIf="errorMessage != null && errorMessage != ''">
      </app-info-box>

      <app-button
        class="entry__button"
        [disabled]="!twoFactorForm.valid"
        [variant]="'secondary'"
        type="submit"
        size="large"
        [isLoading]="isLoading">
        Verify
      </app-button>
    </div>
    <div class="link" (click)="cancelTwoFactor()">Back to sign in</div>
  </form>
</div>
<div class="form-container" *ngIf="!twoFactorToken">
  <form [formGroup]="form" (ngSubmit)="login()">
    <div class="entry__fieldset">
      <app-form-field
        class="field"
        title="Email"
        placeholder="Enter your Email"
        description="Your account's Email"
        [control]="getControl('email')"
        icon="icon-info"
      ></app-form-field>

      <app-form-field
        class="field"
        title="Password"
        placeholder="Enter your password"
        description="Your password"
        [control]="getControl('password')"
        inputType="password"
        icon="icon-info"
      ></app-form-field>

      <app-info-box message="{{errorMessage}}" [type]="'error'" *ngIf="errorMessage != null && errorMessage != ''">
      </app-info-box>

      <app-button 
        class="entry__button" 
        [disabled]="!form.valid" 
        [variant]="'secondary'" 
        type="submit"
        size="large"
        [isLoading]="isLoading">
        Login
      </app-button>
    </div>
    <div routerLink="/partner-auth/forgot-password" class="link">
      Forgot password?
    </div>
  </form>

  <div class="entry__top">
    <div class="entry__text">or sign in with your Google account</div>
    <div class="entry__btns">
      <button type="button" (click)="googleLogin()" class="button-google entry__button"><img
          src="assets/img/content/google.svg" alt="Google">Google</button>
    </div>
  </div>

  <div class="entry__note">This site is protected by reCAPTCHA and the Google Privacy Policy.</div>
</div>
