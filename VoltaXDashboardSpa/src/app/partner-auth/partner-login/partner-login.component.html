<div class="icon">
  <img src="/assets/images/logos/partner-logo.png" alt="">
</div>
<div class="form-container">
  <form [formGroup]="form">
    <div class="entry__fieldset">
      <app-form-field
        class="field"
        title="Email"
        placeholder="Enter your Email"
        description="Your account's Email"
        [control]="getControl('email')"
        icon="icon-info"
      ></app-form-field>

      <app-form-field
        class="field"
        title="Password"
        placeholder="Enter your password"
        description="Your password"
        [control]="getControl('password')"
        inputType="password"
        icon="icon-info"
      ></app-form-field>

      <div class="error">
        {{errorMessage}}
      </div>

      <app-button 
        class="entry__button" 
        [disabled]="!form.valid" 
        (btnClick)="login()" 
        [variant]="'secondary'" 
        size="large"
        [isLoading]="isLoading">
        Login
      </app-button>
    </div>
    <div routerLink="/partner-auth/forgot-password" class="link">
      Forgot password?
    </div>
  </form>


  <div class="entry__note">This site is protected by reCAPTCHA and the Google Privacy Policy.</div>
</div>
