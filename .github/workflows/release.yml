# Release image: builds VoltaXApi/Dockerfile and pushes it to the GitHub Container Registry when a version
# tag (v1.2.3) is pushed, or by hand (Actions > Release image > Run workflow).
#
# Owner to enable (nothing here needs a secret: GITHUB_TOKEN pushes to this repository's packages):
#   1. Settings > Actions > General > Workflow permissions: leave "Read repository contents" as the default;
#      this workflow asks for packages: write itself.
#   2. After the first run, open the package (ghcr.io/<owner>/eveon-api) and choose its visibility; for a
#      private package, give the EC2 host a token with read:packages (`docker login ghcr.io`).
#   3. Deploy a release with VoltaXApi/deploy.sh: IMAGE=ghcr.io/<owner>/eveon-api TAG=1.2.3 SKIP_BUILD=1.
#      The EC2 test host (deploy-ec2.sh) builds locally and does not use this image.
name: Release image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry paths are lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eveon-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=eveon-api
            org.opencontainers.image.description=EVEON API: OCPP CSMS, REST and SignalR for the dashboard and mobile app

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: VoltaXApi
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
